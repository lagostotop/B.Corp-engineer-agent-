<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0F">
<title>Brain 3.0 - AI Assistant by B.CORP v5.5.5</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script defer src="https://cdn.jsdelivr.net/npm/marked@14.1.2/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>

<style>
:root{--bcorp-blue:#00BFFF;--bg:#0A0A0F;--card:#131a2a;--border:#1e293b;--user:linear-gradient(135deg,#0047ff 0%,#0077ff 100%);--text:#FFFFFF;--muted:#64748b;--sidebar-w:260px}
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;background:var(--bg)}
body{font-family:'Inter',sans-serif;color:var(--text);height:100dvh;overflow:hidden;display:flex}

.sidebar{position:fixed;left:0;top:0;width:var(--sidebar-w);height:100dvh;background:#0A0A0F;border-right:1px solid var(--border);padding:16px 10px;overflow-y:auto;z-index:200;transition:transform.3s ease;display:flex;flex-direction:column;transform:translateX(-100%)}
.sidebar.show{transform:translateX(0)}.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:199}
.sidebar-overlay.show{display:block}.close-sidebar{display:none;font-size:24px;color:var(--bcorp-blue);cursor:pointer;padding:6px 10px;position:absolute;right:10px;top:10px;background:0;border:none}
.new-chat-btn{width:100%;padding:12px;background:var(--bcorp-blue);color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer;margin-bottom:20px;font-family:'Space Grotesk',sans-serif}
.chat-item{padding:12px;border-radius:8px;cursor:pointer;margin-bottom:5px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.chat-item:hover,.chat-item.active{background:#1e293b}.chat-delete{opacity:0;cursor:pointer;color:#ef4444;padding:4px 8px;border:none;background:0}
/* FIX 15: Added space for hover */
.chat-item:hover .chat-delete{opacity:1}

#appContainer{display:flex!important;flex-direction:column;flex:1;margin-left:0;height:100dvh}
@media (min-width:769px){.sidebar{transform:translateX(0)}#appContainer{margin-left:var(--sidebar-w)}.hamburger{display:none!important}}

/* FIX 16: Smaller hero for mobile */
.hero-top{text-align:center;padding:16px 16px 10px;border-bottom:1px solid var(--border);max-width:800px;margin:0 auto;width:100%}
.brain-img.big{width:64px;height:64px;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 0 30px var(--bcorp-blue))}
.bcorp-title{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;background:linear-gradient(90deg,#00BFFF,#4FC3F7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

.hamburger{display:none;font-size:24px;cursor:pointer;color:var(--bcorp-blue);position:fixed;top:15px;left:15px;z-index:300;background:#131a2a;padding:10px 14px;border-radius:10px;border:1px solid var(--border)}
.chat-box{flex:1;overflow-y:auto;padding:20px 14px 140px;max-width:800px;margin:0 auto;width:100%}

.message-wrap{display:flex;gap:10px;margin-bottom:16px}
.message-avatar{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.message{padding:14px 16px;border-radius:18px;max-width:85%;line-height:1.65;font-size:15px;animation:fadeIn.3s ease;position:relative}
.user-msg{background:var(--user);margin-left:auto;color:#fff;white-space:pre-wrap}
.ai-msg{background:var(--card);border:1px solid var(--border);color:#FFF}
.ai-msg pre{background:#020617;padding:14px;border-radius:10px;overflow-x:auto;margin:12px 0;border:1px solid var(--border)}
.msg-meta{font-size:11px;color:var(--muted);margin-top:6px}
.copy-btn{position:absolute;top:8px;right:8px;font-size:11px;background:#020617;border:1px solid var(--border);color:var(--muted);padding:4px 8px;border-radius:6px;cursor:pointer}
.copy-btn:hover{color:var(--text)}
.agent-banner{background:linear-gradient(90deg,#0047ff,#00BFFF);padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;margin-bottom:10px;display:inline-block}
.sources{margin-top:16px;padding:12px;border:1px solid var(--border);border-radius:10px;background:#020617}
.source-card{margin:6px 0;font-size:13px}
.source-card a{color:var(--bcorp-blue);text-decoration:none}
.source-card a:hover{text-decoration:underline}

.input-area{background:rgba(10,10,15,.95);backdrop-filter:blur(12px);padding:14px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-end;position:sticky;bottom:0;max-width:800px;margin:0 auto;width:100%;flex-wrap:wrap}
.input-wrapper{flex:1;display:flex;align-items:center;background:#020617;border:1px solid var(--border);border-radius:16px;padding:0 6px 0 16px;min-width:0}
#userInput{flex:1;padding:16px 10px;background:transparent;border:none;color:#e2e8f0;font-size:16px;outline:none;resize:none;max-height:200px;font-family:'Inter',sans-serif}
.upload-btn{padding:10px;background:transparent;border:none;cursor:pointer;font-size:20px;color:#64748b}
.control-btn{padding:10px 14px;background:var(--border);color:var(--text);border:none;border-radius:10px;font-weight:600;cursor:pointer;font-size:13px}
.control-btn:hover{background:#334155}
.send-btn{padding:14px 24px;background:linear-gradient(135deg,#0077ff 0%,#00BFFF 100%);color:#fff;border:none;border-radius:12px;font-weight:700;cursor:pointer;font-family:'Space Grotesk',sans-serif}
.send-btn:disabled{opacity:.5}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1}}

#authScreen{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center}
.auth-card{max-width:400px;width:90%;padding:40px;background:var(--card);border:1px solid var(--border);border-radius:16px;text-align:center}
.auth-card h2{font-family:'Space Grotesk',sans-serif;font-size:28px;margin-bottom:8px;background:linear-gradient(90deg,#00BFFF,#4FC3F7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.auth-input{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:1px solid var(--border);background:#020617;color:var(--text);font-size:15px}
.auth-btn{width:100%;padding:14px;background:linear-gradient(135deg,#0077ff 0%,#00BFFF 100%);color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer;margin-top:8px;font-family:'Space Grotesk',sans-serif}
.auth-btn.secondary{background:var(--border)}.auth-btn:disabled{opacity:.6;cursor:not-allowed}
.auth-error{color:#ef4444;margin-top:12px;font-size:13px;min-height:18px}
.auth-status{color:#64748b;margin-top:12px;font-size:13px;min-height:18px}
.logout-btn{position:absolute;top:15px;right:15px;background:#ef4444;color:white;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;z-index:250}
</style>
</head>
<body>

<div id="authScreen" style="display:flex">
  <div class="auth-card">
    <h2>Brain 3.0</h2>
    <p style="color:var(--muted);margin-bottom:24px">Sign in to B.CORP AI</p>
    <input id="emailInput" type="email" placeholder="Email" class="auth-input" autocomplete="email">
    <input id="passwordInput" type="password" placeholder="Password" class="auth-input" autocomplete="current-password">
    <button id="loginBtn" class="auth-btn">Sign In</button>
    <button id="signupBtn" class="auth-btn secondary">Create Account</button>
    <p id="authError" class="auth-error"></p>
    <p id="authStatus" class="auth-status">Initializing secure authentication...</p>
  </div>
</div>

<div id="chatContainer" style="display:none;width:100%;height:100%">
  <button id="logoutBtn" class="logout-btn">Logout</button>
  
  <div class="sidebar" id="sidebar">
    <button class="close-sidebar" id="closeSidebarBtn">✕</button>
    <button class="new-chat-btn" id="newChatBtn">+ New Chat</button>
    <div id="chatList" style="flex:1;overflow-y:auto"></div>
  </div>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div id="appContainer">
    <button class="hamburger" id="hamburgerBtn">☰</button>
    <div class="hero-top">
      <img src="/static/brain3d.png" class="brain-img big" alt="Brain">
      <h1 class="bcorp-title">B.CORP</h1>
      <p style="color:#888;font-size:13px">Brain 3.0 • AI Assistant • 2026</p>
    </div>
    <div class="chat-box" id="chatBox"></div>
    
    <form id="chatForm" class="input-area">
      <input type="file" id="fileInput" style="display:none">
      
      <!-- FIX 14: Added Stop and Regen buttons -->
      <button type="button" class="control-btn" id="stopBtn" style="display:none">Stop</button>
      <button type="button" class="control-btn" id="regenBtn" style="display:none">Regenerate</button>

      <div class="input-wrapper">
        <button type="button" class="upload-btn" id="uploadBtn" title="Attach file">📎</button>
        <textarea id="userInput" placeholder="Ask Brain 3.0..." rows="1"></textarea>
      </div>
      <button type="submit" class="send-btn" id="sendBtn">Send</button>
    </form>
  </div>
</div>

<script defer src="/static/app.js"></script>
</body></html>
