<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Brain 3.0 - AI Assistant by B.CORP v3.1.4</title>
    <link rel="manifest" href="/static/manifest.json?v=14">
    <meta name="theme-color" content="#0A0A0F">
    <script src="https://cdn.jsdelivr.net/npm/marked@14.1.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap');
        :root { --bcorp-blue: #00BFFF; --bg: #0A0A0F; --card: #111827; --border: #1e293b; --user: #1e40af; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; }

       .auth-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
       .auth-box { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 35px 30px; box-shadow: 0 0 40px rgba(0,191,255,0.15); }
       .brain { font-size: 60px; text-align:center; filter: drop-shadow(0 0 20px var(--bcorp-blue)); animation: float 3s ease-in-out infinite; margin-bottom: 20px; }
       .auth-box h2 { color: var(--bcorp-blue); text-align: center; margin-bottom: 8px; font-size: 24px; font-family: 'Space Grotesk'; }
       .auth-subtitle { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 25px; }
       .auth-input { width: 100%; padding: 14px; margin-bottom: 14px; background: #020617; border: 1px solid var(--border); border-radius: 12px; color: #e2e8f0; font-size: 15px; outline: none; }
       .auth-input:focus { border-color: var(--bcorp-blue); box-shadow: 0 0 0 3px rgba(0,191,255,0.2); }
       .auth-btn { width: 100%; padding: 14px; margin-bottom: 10px; background: linear-gradient(135deg, var(--bcorp-blue) 0%, #0099cc 100%); color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; }
       .auth-btn.secondary { background: #1e293b; border: 1px solid var(--border); }
       .auth-error { color: #ef4444; font-size: 12px; text-align: center; margin-top: 10px; min-height: 16px; }

        #appContainer { display: none; flex-direction: column; height: 100vh; }
       .bcorp-face { text-align: center; padding: 30px 20px 15px; }
       .brain.big { font-size: 70px; }
        h1 { color: var(--bcorp-blue); font-size: 32px; font-family: 'Space Grotesk'; text-align:center; }

       .header { background: rgba(10,10,15,0.85); backdrop-filter: blur(12px); padding: 12px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
       .chat-box { flex: 1; overflow-y: auto; padding: 20px 14px 120px; max-width: 750px; margin: 0 auto; width: 100%; }
       .message { margin-bottom: 18px; padding: 16px 18px; border-radius: 16px; max-width: 90%; line-height: 1.6; font-size: 15px; animation: fadeIn 0.3s ease; }
       .user-msg { background: var(--user); margin-left: auto; border-bottom-right-radius: 4px; white-space: pre-wrap; color: #fff; }
       .ai-msg { background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; color: #FFFFFF; }
       .ai-msg h1,.ai-msg h2,.ai-msg h3 { font-family: 'Space Grotesk'; color: var(--bcorp-blue); margin: 16px 0 10px; font-weight: 700; }
       .ai-msg p { margin-bottom: 12px; }
       .ai-msg ul { padding-left: 20px; margin-bottom: 12px; }
       .ai-msg strong { color: var(--bcorp-blue); }
       .ai-msg img { max-width: 100%; border-radius: 12px; margin-top: 12px; border: 1px solid var(--border); }

       .typing::after { content: '▋'; animation: blink 1s infinite; color: var(--bcorp-blue); }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        @keyframes blink { 50% { opacity: 0; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

       .input-area { background: rgba(10,10,15,0.95); backdrop-filter: blur(12px); padding: 14px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; position: fixed; bottom: 0; left: 0; right: 0; max-width: 750px; margin: 0 auto; }
        input { flex: 1; padding: 14px; background: #020617; border: 1px solid var(--border); border-radius: 14px; color: #e2e8f0; font-size: 15px; outline: none; }
        input:focus { border-color: var(--bcorp-blue); }
       .upload-btn { padding: 14px; background: #020617; border: 1px solid var(--border); border-radius: 14px; cursor: pointer; font-size: 18px; }
        button { padding: 14px 22px; background: linear-gradient(135deg, var(--bcorp-blue) 0%, #0099cc 100%); color: white; border: none; border-radius: 14px; font-weight: 600; cursor: pointer; font-size: 15px; }
       .logout-btn { background: transparent; border: 1px solid var(--bcorp-blue); color: var(--bcorp-blue); padding: 8px 14px; border-radius: 8px; font-size: 14px; }
    </style>
</head>
<body>
    <div id="authScreen" class="auth-container">
        <div class="auth-box">
            <div class="brain">🧠</div>
            <h2>Welcome to Brain 3.0</h2>
            <p class="auth-subtitle">AI Assistant by B.CORP</p>
            <input type="email" id="email" class="auth-input" placeholder="Enter your email" autocomplete="email">
            <input type="password" id="password" class="auth-input" placeholder="Enter your password" autocomplete="current-password">
            <button class="auth-btn" id="loginBtn" onclick="signIn()">Login</button>
            <button class="auth-btn secondary" id="signupBtn" onclick="signUp()">Create Account</button>
            <div id="authError" class="auth-error"></div>
        </div>
    </div>

    <div id="appContainer">
        <div class="bcorp-face">
            <div class="brain big">🧠</div>
            <h1>B.CORP</h1>
            <p style="color:#888; font-size:12px; text-align:center;">Brain 3.0 • AI Assistant • 2026</p>
        </div>
        <div class="header">
            <div><div style="font-size:12px;">🧠 Brain 3.0</div><div style="font-size:12px; color:var(--bcorp-blue);" id="userEmail"></div></div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
        <div class="chat-box" id="chatBox"></div>
        <div class="input-area">
            <input type="file" id="fileInput" accept="image/*,.pdf,.txt,.py,.js,.md" style="display:none">
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">📎</button>
            <input type="text" id="userInput" placeholder="Ask Brain 3.0 anything..."/>
            <button onclick="sendMessage()" id="sendBtn">Send</button>
        </div>
    </div>

    <script>
    marked.setOptions({ breaks: true, gfm: true });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) { registration.unregister() }
      });
    }

    let supabaseClient = null;
    let userId = null;
    let userEmail = null;
    let isSending = false;
    let selectedFile = null;

    fetch('/config?v=14')
   .then(res => res.json())
   .then(config => {
        supabaseClient = supabase.createClient(config.supabase_url, config.supabase_key)
        checkAuth();
    }).catch(err=>{
        alert("FATAL: Failed to load config. Check Render Env Vars");
        document.getElementById('authError').innerText = "Failed to load config: " + err.message;
    });

    function checkAuth() {
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if(session) {
                userId = session.user.id;
                userEmail = session.user.email;
                showApp();
            }
        });
    }

    function showApp() {
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('appContainer').style.display = 'flex';
        document.getElementById('userEmail').innerText = userEmail;
        addMessage('ai', `### Welcome back CEO 👋
I'm **Brain 3.0 by B.CORP**.

### What I can do
- **Chat**: Ask me anything
- **Vision**: Upload image to analyze
- **Docs**: Upload PDF to summarize
- **Code**: Upload code to debug
- **Image Gen**: "imagine a logo for B.CORP"

What should we build today?`);
    }

    async function signUp() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('authError');
        const btn = document.getElementById('signupBtn');

        if(!email ||!password) return alert("Fill all fields");
        if(!supabaseClient) return alert("Supabase not loaded. Check /config");

        btn.disabled = true; btn.innerText = "Creating..."; errorDiv.innerText = "";
        const { data, error } = await supabaseClient.auth.signUp({ email, password })
        btn.disabled = false; btn.innerText = "Create Account";
        if(error) { alert("SIGNUP ERROR: " + error.message); errorDiv.innerText = error.message; }
        else { alert("Success! Account created. You can Login now."); }
    }

    async function signIn() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('authError');
        const btn = document.getElementById('loginBtn');

        if(!email ||!password) return alert("Fill all fields");
        if(!supabaseClient) return alert("Supabase not loaded. Check /config");

        btn.disabled = true; btn.innerText = "Logging in..."; errorDiv.innerText = "";
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password })
        btn.disabled = false; btn.innerText = "Login";
        if(error) { alert("LOGIN ERROR: " + error.message); errorDiv.innerText = error.message; }
        else { userId = data.user.id; userEmail = data.user.email; showApp(); }
    }

    async function logout() { await supabaseClient.auth.signOut(); location.reload(); }

    function formatAIText(text) {
        text = text.replace(/(\w)-(\w)/g, '$1 - $2');
        text = text.replace(/([^\n])###/g, '$1\n###');
        text = text.replace(/([^\n])(\d+\.)/g, '$1\n$2');
        text = text.replace(/(\.)([A-Z])/g, '$1\n$2');
        return text;
    }

    function addMessage(role, text) {
        const div = document.createElement('div');
        div.className = 'message ' + (role === 'user'? 'user-msg' : 'ai-msg');
        if(role === 'ai') text = formatAIText(text);
        div.innerHTML = marked.parse(text);
        document.getElementById('chatBox').appendChild(div);
        document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
        return div;
    }

    document.getElementById('fileInput').addEventListener('change', (e)=>{ selectedFile = e.target.files[0]; });

    async function sendMessage() {
        if (!userId || isSending) return;
        isSending = true; document.getElementById('sendBtn').disabled = true;
        const input = document.getElementById('userInput');
        const message = input.value.trim();
        if (!message &&!selectedFile) { isSending = false; document.getElementById('sendBtn').disabled = false; return; }

        if(message) addMessage('user', message);
        input.value = '';

        const botBox = addMessage('ai', '<span class="typing">Thinking...</span>');
        let fullAnswer = '';
        let buffer = '';
        let chunkBuffer = '';

        try {
            const formData = new FormData();
            formData.append('question', message);
            formData.append('user_name', userEmail? userEmail.split('@')[0] : 'CEO');
            formData.append('user_id', userId);
            if(selectedFile) formData.append('file', selectedFile);

            const response = await fetch('/ask', { method: 'POST', body: formData });
            if(!response.ok) throw new Error(`Server error: ${response.status}`);

            const contentType = response.headers.get("content-type");

            if (contentType && contentType.includes("application/json")) {
                const data = await response.json();
                if (data.error) throw new Error(data.error);

                let html = marked.parse(formatAIText(data.answer));
                if (data.image) {
                    html += `<img src="${data.image}" alt="Generated Image" />`;
                }
                botBox.innerHTML = html;

            } else {
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                while (true) {
                    const {done, value} = await reader.read();
                    if (done) {
                        fullAnswer += chunkBuffer;
                        botBox.innerHTML = marked.parse(formatAIText(fullAnswer));
                        break;
                    }
                    buffer += decoder.decode(value, {stream: true});
                    const lines = buffer.split('\n');
                    buffer = lines.pop();
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            let text = line.slice(6);
                            if (text === '[DONE]') continue;
                            chunkBuffer += text;
                            if (/[ \n.,;:!?]$/.test(chunkBuffer)) {
                                fullAnswer += chunkBuffer;
                                chunkBuffer = '';
                                botBox.innerHTML = marked.parse(formatAIText(fullAnswer));
                                document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
                            }
                        }
                    }
                }
            }
        } catch (e) { botBox.innerHTML = marked.parse('**❌ Error:** ' + e.message); }

        document.getElementById('sendBtn').disabled = false;
        isSending = false;
        selectedFile = null;
        document.getElementById('fileInput').value = '';
        document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
    }
    document.getElementById('userInput').addEventListener('keypress', e => { if (e.key === 'Enter' &&!e.shiftKey) { e.preventDefault(); sendMessage(); } });
    </script>
</body>
                                                      </html>
