<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Brain 3.0 - AI Assistant by B.CORP v3.0.2</title>

    <link rel="manifest" href="/static/manifest.json?v=4">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
    <meta name="theme-color" content="#0A0A0F">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Brain 3.0">
    <link rel="apple-touch-icon" href="/static/icon-180.png">

    <script src="https://cdn.jsdelivr.net/npm/marked@14.1.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap');
        :root { --bcorp-blue: #00BFFF; --bg: #0A0A0F; --card: #0f172a; --border: #1e293b; --user: #1e40af; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; }

      .auth-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
      .auth-box { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 35px 30px; box-shadow: 0 0 40px rgba(0,191,255,0.1); }
      .auth-logo { text-align: center; margin-bottom: 25px; }
      .auth-logo.brain { font-size: 60px; filter: drop-shadow(0 0 20px var(--bcorp-blue)); animation: float 3s ease-in-out infinite; }
      .auth-box h2 { color: var(--bcorp-blue); text-align: center; margin-bottom: 8px; font-size: 24px; font-family: 'Space Grotesk'; }
      .auth-subtitle { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 25px; }
      .auth-input { width: 100%; padding: 14px; margin-bottom: 14px; background: #020617; border: 1px solid var(--border); border-radius: 12px; color: #e2e8f0; font-size: 15px; outline: none; }
      .auth-input:focus { border-color: var(--bcorp-blue); }
      .auth-btn { width: 100%; padding: 14px; margin-bottom: 10px; background: linear-gradient(135deg, var(--bcorp-blue) 0%, #0099cc 100%); color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s; }
      .auth-btn:hover { transform: scale(1.02); }
      .auth-btn.secondary { background: #1e293b; border: 1px solid var(--border); }
      .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }
      .auth-error { color: #ef4444; font-size: 12px; text-align: center; margin-top: 10px; min-height: 16px; }

        #appContainer { display: none; flex-direction: column; height: 100vh; }
      .bcorp-face { text-align: center; padding: 30px 20px 15px; }
      .brain { font-size: 70px; animation: float 3s ease-in-out infinite; filter: drop-shadow(0 0 15px var(--bcorp-blue)); }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } /* FIXED */
        @keyframes blink { 50% { opacity: 0; } /* FIXED */
        h1 { color: var(--bcorp-blue); font-size: 32px; font-family: 'Space Grotesk'; }

      .header { background: rgba(10,10,15,0.8); backdrop-filter: blur(10px); padding: 12px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
      .mode-select { background: #020617; border: 1px solid var(--border); color: #e2e8f0; border-radius: 8px; padding: 6px 10px; font-family: 'Inter'; }
      .chat-box { flex: 1; overflow-y: auto; padding: 20px 14px; max-width: 750px; margin: 0 auto; width: 100%; }
      .message { margin-bottom: 18px; padding: 16px 18px; border-radius: 14px; max-width: 90%; line-height: 1.8; font-size: 15px; white-space: pre-wrap; }
      .user-msg { background: var(--user); margin-left: auto; border-bottom-right-radius: 4px; }
      .ai-msg { background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
      .typing::after { content: '▋'; animation: blink 1s infinite; color: var(--bcorp-blue); }

      .ai-msg h1,.ai-msg h2,.ai-msg h3 { font-family: 'Space Grotesk'; color: var(--bcorp-blue); margin-top: 16px; margin-bottom: 8px; font-weight: 700; }
      .ai-msg h3 { font-size: 18px; }
      .ai-msg p { margin-bottom: 12px; }
      .ai-msg ul,.ai-msg ol { margin-left: 20px; margin-bottom: 12px; }
      .ai-msg li { margin-bottom: 6px; }
      .ai-msg strong { color: var(--bcorp-blue); font-weight: 600; }
      .ai-msg code { background: #09090F; padding: 2px 6px; border-radius: 6px; font-family: 'Consolas', monospace; font-size: 13px; color: #7dd3fc; }
      .ai-msg pre { background: #09090F; padding: 14px; border-radius: 12px; overflow-x: auto; margin: 12px 0; border: 1px solid var(--border); }
      .ai-msg pre code { background: none; padding: 0; color: #e2e8f0; }
      .ai-msg blockquote { border-left: 3px solid var(--bcorp-blue); padding-left: 12px; margin: 12px 0; color: #94a3b8; }

      .input-area { background: rgba(10,10,15,0.9); backdrop-filter: blur(10px); padding: 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
        input { flex: 1; padding: 14px; background: #020617; border: 1px solid var(--border); border-radius: 12px; color: #e2e8f0; font-family: 'Inter'; }
      .upload-btn { padding: 14px; background: #020617; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; }
        button { padding: 14px 22px; background: var(--bcorp-blue); color: white; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; font-family: 'Inter'; }
        button:disabled { opacity: 0.5; }
      .logout-btn { background: transparent; border: 1px solid var(--bcorp-blue); color: var(--bcorp-blue); padding: 8px 14px; border-radius: 8px; }
    </style>
</head>
<body>
    <div id="authScreen" class="auth-container">
        <div class="auth-box">
            <div class="auth-logo"><div class="brain">🧠</div></div>
            <h2>Welcome to Brain 3.0</h2>
            <p class="auth-subtitle">AI Assistant by B.CORP</p>
            <input type="email" id="email" class="auth-input" placeholder="Enter your email" autocomplete="email">
            <input type="password" id="password" class="auth-input" placeholder="Enter your password" autocomplete="current-password">
            <button class="auth-btn" id="loginBtn" onclick="signIn()">Login</button>
            <button class="auth-btn secondary" id="signupBtn" onclick="signUp()">Create Account</button>
            <div id="authError" class="auth-error"></div>
        </div>
    </div>

    <div id="appContainer">
        <div class="bcorp-face">
            <div class="brain">🧠</div>
            <h1>B.CORP</h1>
            <p style="color:#888; font-size:12px;">Brain 3.0 • AI Assistant • 2026</p>
        </div>
        <div class="header">
            <div><div style="font-size:12px;">🧠 Brain 3.0</div><div style="font-size:12px; color:var(--bcorp-blue);" id="userEmail"></div></div>
            <div style="display:flex; gap:8px;">
                <select id="modeSelect" class="mode-select">
                    <option value="pro">Pro Mode</option>
                    <option value="pidgin">Naija Mode</option>
                    <option value="code">Code Master</option>
                </select>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>
        <div class="chat-box" id="chatBox"></div>
        <div class="input-area">
            <input type="file" id="fileInput" accept="image/*,.pdf,.txt,.py,.js,.md" style="display:none">
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">📎</button>
            <input type="text" id="userInput" placeholder="Ask Brain 3.0 anything..."/>
            <button onclick="sendMessage()" id="sendBtn">Send</button>
        </div>
    </div>

    <script>
    marked.setOptions({ breaks: true, gfm: true });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) { registration.unregister() }
      });
    }

    let supabaseClient = null;
    let userId = null;
    let userEmail = null;
    let isSending = false;
    let selectedFile = null;

    fetch('/config?v=4')
  .then(res => res.json())
  .then(config => {
        supabaseClient = supabase.createClient(config.supabase_url, config.supabase_key)
        checkAuth();
    }).catch(err=>{
        document.getElementById('authError').innerText = "Failed to load config: " + err.message;
    });

    function checkAuth() {
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if(session) {
                userId = session.user.id;
                userEmail = session.user.email;
                showApp();
            }
        });
    }

    function showApp() {
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('appContainer').style.display = 'flex';
        document.getElementById('userEmail').innerText = userEmail;
        addMessage('ai', `### Welcome back CEO 👋\nI'm **Brain 3.0 by B.CORP**. \n\n### What I can do\n- **Pro Mode**: Business strategy, research\n- **Naija Mode**: Talk in Pidgin\n- **Code Master**: Review and fix code\nWhat should we build today?`);
    }

    async function signUp() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('authError');
        const btn = document.getElementById('signupBtn');
        
        if(!email ||!password) return errorDiv.innerText = "Fill all fields";
        btn.disabled = true; errorDiv.innerText = "Creating account...";
        
        const { data, error } = await supabaseClient.auth.signUp({ email, password })
        
        btn.disabled = false;
        if(error) {
            console.error("SIGNUP ERROR:", error);
            errorDiv.innerText = error.message;
        } else {
            errorDiv.style.color = '#22c55e';
            errorDiv.innerText = "Account created! You can Login now.";
            setTimeout(()=>errorDiv.style.color='#ef4444', 3000);
        }
    }

    async function signIn() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('authError');
        const btn = document.getElementById('loginBtn');
        
        if(!email ||!password) return errorDiv.innerText = "Fill all fields";
        btn.disabled = true; errorDiv.innerText = "Logging in...";
        
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password })
        
        btn.disabled = false;
        if(error) {
            console.error("LOGIN ERROR:", error);
            errorDiv.innerText = error.message;
        } else { 
            userId = data.user.id; 
            userEmail = data.user.email; 
            showApp(); 
        }
    }

    async function logout() { await supabaseClient.auth.signOut(); location.reload(); }

    function addMessage(role, text) {
        const div = document.createElement('div');
        div.className = 'message ' + (role === 'user'? 'user-msg' : 'ai-msg');
        div.innerHTML = marked.parse(text);
        document.getElementById('chatBox').appendChild(div);
        document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
        return div;
    }

    document.getElementById('fileInput').addEventListener('change', (e)=>{ selectedFile = e.target.files[0]; });

    async function sendMessage() {
        if (!userId || isSending) return;
        isSending = true; document.getElementById('sendBtn').disabled = true;
        const input = document.getElementById('userInput');
        const message = input.value.trim();
        const mode = document.getElementById('modeSelect').value;
        if (!message &&!selectedFile) { isSending = false; document.getElementById('sendBtn').disabled = false; return; }

        if(message) addMessage('user', message);
        input.value = '';

        const botBox = addMessage('ai', '<span class="typing">Thinking...</span>');
        let fullAnswer = '';
        let buffer = '';
        let lastChar = '';

        try {
            const formData = new FormData();
            formData.append('question', message);
            formData.append('mode', mode);
            formData.append('user_name', userEmail.split('@')[0]);
            formData.append('user_id', userId);
            if(selectedFile) formData.append('file', selectedFile);

            const response = await fetch('/ask', { method: 'POST', body: formData });
            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            while (true) {
                const {done, value} = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, {stream: true});
                const lines = buffer.split('\n');
                buffer = lines.pop();

                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        let text = line.slice(6);
                        if (text === '[DONE]') continue;
                        if (lastChar && /[a-zA-Z0-9]$/.test(lastChar) && /^[a-zA-Z]/.test(text)) {
                            text = " + text;
                        }
                        fullAnswer += text;
                        lastChar = text.slice(-1);
                        botBox.innerHTML = marked.parse(fullAnswer);
                        document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
                    }
                }
            }
        } catch (e) { botBox.innerHTML = marked.parse('**Error:** ' + e.message); }
        document.getElementById('sendBtn').disabled = false;
        isSending = false;
        selectedFile = null;
        document.getElementById('fileInput').value = '';
    }
    document.getElementById('userInput').addEventListener('keypress', e => { if (e.key === 'Enter' &&!e.shiftKey) { e.preventDefault(); sendMessage(); } });
    </script>
</body>
  </html>
