<script src="https://cdn.jsdelivr.net/npm/marked@14.1.2/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script><style>:root{--bg:#070A10;--panel:#0D131E;--line:rgba(148,163,184,.12);--line2:rgba(148,163,184,.18);--blue:#00BFFF;--text:#F8FAFC;--text2:#CBD5E1;--muted:#718096;--green:#22C55E;--red:#EF4444;--sidebar:270px;--content:1000px}*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;background:var(--bg)}body{color:var(--text);font-family:Inter,sans-serif;overflow:hidden}button,input,textarea{font:inherit}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#243247;border-radius:20px}

#chatContainer{position:relative;width:100%;height:100dvh;display:flex}.sidebar{position:fixed;left:0;top:0;bottom:0;z-index:500;width:var(--sidebar);padding:15px 12px;display:flex;flex-direction:column;background:linear-gradient(180deg,#090D15 0%,#070A10 100%);border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .3s ease}.sidebar.show{transform:translateX(0)}.sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:5px 7px 18px}.brand{display:flex;align-items:center;gap:10px}.brand-logo{width:35px;height:35px;filter:drop-shadow(0 0 12px rgba(0,191,255,.35))}.brand-text{font-family:"Space Grotesk",sans-serif;font-size:17px;font-weight:700}.brand-text span{display:block;color:#526174;font-size:9px}.close-sidebar{display:flex;width:34px;height:34px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:9px;color:var(--muted);background:#0D141F;cursor:pointer}.new-chat-btn{width:100%;height:46px;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid rgba(0,191,255,.22);border-radius:13px;color:#fff;background:linear-gradient(135deg,rgba(22,71,255,.9),rgba(0,191,255,.85));cursor:pointer;font-family:"Space Grotesk",sans-serif;font-weight:700}.sidebar-label{margin:22px 7px 9px;color:#526174;font-size:9px;font-weight:700;text-transform:uppercase}#chatList{flex:1;overflow-y:auto}.chat-item{width:100%;display:flex;align-items:center;gap:9px;margin-bottom:3px;padding:10px;border-radius:10px;color:#94A3B8;cursor:pointer;font-size:12px}.chat-item:hover,.chat-item.active{color:#fff;background:#101925}.chat-item-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chat-delete{opacity:0;padding:4px;border:0;color:#64748B;background:transparent;cursor:pointer}.chat-item:hover .chat-delete{opacity:1}.user-profile{display:flex;align-items:center;gap:9px;margin-top:12px;padding:10px;border-top:1px solid var(--line)}.user-avatar{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:11px;color:#fff;background:linear-gradient(135deg,#1647FF,#00BFFF);font-size:12px;font-weight:700}.user-email{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#94A3B8;font-size:10px}.logout-btn{padding:7px;border:0;color:#718096;background:transparent;cursor:pointer;font-size:11px}.sidebar-overlay{display:none;position:fixed;inset:0;z-index:450;background:rgba(0,0,0,.68);backdrop-filter:blur(3px)}.sidebar-overlay.show{display:block}

#appContainer{position:relative;width:100%;height:100dvh;margin-left:0;display:flex;flex-direction:column}@media (min-width:1100px){.sidebar{transform:translateX(-100%)}#appContainer{margin-left:0}.hamburger{display:flex}}@media (max-width:1099px){.sidebar{width:min(300px,85vw)}.sidebar.show{transform:translateX(0)}.hamburger{display:flex}.close-sidebar{display:flex}#appContainer{margin-left:0}.chat-box{padding-left:clamp(12px,3vw,24px);padding-right:clamp(12px,3vw,24px)}}

.topbar{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(7,10,16,.78);backdrop-filter:blur(20px)}.topbar-left{display:flex;align-items:center;gap:11px}.hamburger{display:flex;width:40px;height:40px;align-items:center;justify-content:center;flex:0 0 40px;border:1px solid var(--line2);border-radius:10px;color:#fff;background:#101824;cursor:pointer;font-size:18px}.top-title{font-family:"Space Grotesk",sans-serif;font-size:15px;font-weight:700}.top-subtitle{display:flex;align-items:center;gap:6px;margin-top:2px;color:#526174;font-size:9px}.status-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}.topbar-badge{padding:6px 10px;border:1px solid rgba(0,191,255,.16);border-radius:20px;color:#70DFFF;background:rgba(0,191,255,.05);font-size:9px;font-weight:700}

.chat-box{flex:1;overflow-y:auto;padding:20px 24px 170px}.chat-inner{width:100%;max-width:var(--content);margin:0 auto}

.message-wrap{width:100%;margin-bottom:27px}.message-row{display:flex;align-items:flex-start;gap:11px}.message-row.user{justify-content:flex-end}.message-avatar{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line2);border-radius:11px;background:#101925;color:#fff;font-size:11px;font-weight:700}.user-avatar-small{background:linear-gradient(135deg,#1647FF,#0077FF)}.ai-avatar{background:radial-gradient(circle at 30% 30%,#00BFFF,#1647FF)}.message{max-width:min(900px,88%);padding:13px 16px;border-radius:17px;font-size:14px;line-height:1.7;animation:messageIn .2s ease}.user-msg{color:#fff;background:linear-gradient(135deg,#1746B5,#0759DB);border-bottom-right-radius:5px;white-space:pre-wrap}.ai-msg{color:#E7EDF5;background:#0F1723;border:1px solid var(--line);border-bottom-left-radius:5px}.ai-msg pre{margin:13px 0;padding:14px;overflow-x:auto;border:1px solid #1D2B3E;border-radius:11px;background:#05090F}.ai-msg code{background:#080D14;color:#7DD3FC;padding:2px 5px;border-radius:5px}.agent-banner{display:inline-flex;align-items:center;gap:6px;margin-bottom:9px;padding:6px 9px;border:1px solid rgba(0,191,255,.17);border-radius:8px;color:#73DFFF;background:rgba(0,191,255,.055);font-size:9px;font-weight:700}.sources{margin-top:15px;padding:12px;border:1px solid var(--line);border-radius:11px;background:#080E16}.sources-title{margin-bottom:7px;color:#94A3B8;font-size:10px;font-weight:700}.source-card{padding:4px 0;font-size:11px}.source-card a{color:#55D8FF}.copy-row{display:flex;gap:5px;margin:5px 0 0 45px}.copy-btn{padding:5px 8px;border:1px solid transparent;border-radius:7px;color:#64748B;background:transparent;cursor:pointer;font-size:10px}.copy-btn:hover{color:#DCE5EF;background:#111A27}

#filePreview{display:none;margin-bottom:8px}.file-preview{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line2);border-radius:11px;background:#0B121C}.file-preview-icon{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:rgba(0,191,255,.07)}.file-preview span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#CBD5E1;font-size:11px}.file-remove{border:0;background:transparent;color:#718096;cursor:pointer;font-size:18px}

.input-shell{position:absolute;left:0;right:0;bottom:0;z-index:150;padding:12px clamp(10px,3vw,22px) 16px;background:linear-gradient(180deg,transparent,rgba(7,10,16,.88) 35%)}.input-area{width:100%;max-width:1000px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;flex-direction:column}.input-row{display:flex;align-items:flex-end;gap:8px;width:100%;min-width:0}.input-wrapper{flex:1 1 auto;min-width:0;display:flex;align-items:center;background:#080D15;border:1px solid var(--line2);border-radius:16px;padding:0 6px 0 16px}#userInput{flex:1;min-width:0;padding:16px 10px;background:transparent;border:none;color:#e2e8f0;font-size:16px;outline:none;resize:none;max-height:200px}.upload-btn{padding:10px;background:transparent;border:none;cursor:pointer;font-size:20px;color:#64748b}.control-btn{padding:10px 14px;background:#121B28;color:var(--text);border:1px solid var(--line);border-radius:10px;font-weight:600;cursor:pointer;font-size:13px}.send-btn{flex:0 0 auto;min-width:70px;height:52px;padding:0 16px;background:linear-gradient(135deg,#1647FF,#00BFFF);color:#fff;border:none;border-radius:12px;font-weight:700;font-family:"Space Grotesk",sans-serif}.send-btn:disabled{opacity:.5}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes messageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1}}

@media (max-width:600px){.topbar{height:56px;padding:0 10px}.top-title{font-size:14px}.topbar-badge{display:none}.chat-box{padding:14px 10px 145px}.message{max-width:92%;font-size:14px;line-height:1.6;padding:12px 13px}.message-row{gap:8px}.message-avatar{width:30px;height:30px;flex:0 0 30px}.input-shell{padding:8px 8px max(10px,env(safe-area-inset-bottom))}.input-area{max-width:none}.input-row{gap:6px}.input-wrapper{border-radius:15px;padding-left:8px}#userInput{min-height:48px;padding:13px 7px;font-size:16px}.upload-btn{padding:8px;font-size:18px}.send-btn{min-width:52px;width:52px;height:52px;padding:0;font-size:0}.send-btn::after{content:"➤";font-size:18px}.control-btn{padding:9px 10px;font-size:11px}.copy-row{margin-left:38px}}@media (min-width:601px) and (max-width:1099px){.chat-box{padding-left:18px;padding-right:18px}.input-shell{padding-left:16px;padding-right:16px}}@media (min-width:1100px){.input-shell{padding-left:24px;padding-right:24px}.chat-box{padding-left:32px;padding-right:32px}}</style></head><body>
<div id="chatContainer"><div class="app-shell"><div class="sidebar" id="sidebar"><div class="sidebar-header"><div class="brand"><img src="/static/brain3d.png" class="brand-logo"><div class="brand-text">Brain 3.0<span>B.CORP AI</span></div></div><button class="close-sidebar" id="closeSidebarBtn">✕</button></div><button class="new-chat-btn" id="newChatBtn">+ New Chat</button><div class="sidebar-label">Recent</div><div id="chatList"></div><div class="user-profile"><div class="user-avatar" id="userAvatar">U</div><div class="user-email" id="userEmailDisplay">Guest</div><button class="logout-btn" id="logoutBtn" style="display:none">Logout</button></div></div><div class="sidebar-overlay" id="sidebarOverlay"></div>
<div id="appContainer"><div class="topbar"><div class="topbar-left"><button class="hamburger" id="hamburgerBtn">☰</button><div><div class="top-title">Brain 3.0</div><div class="top-subtitle"><span class="status-dot"></span>Online</div></div></div><div class="topbar-badge">B.CORP</div></div>
<div class="chat-box" id="chatBox"></div>
<div class="input-shell"><form id="chatForm" class="input-area"><div id="filePreview" class="file-preview"><div class="file-preview-icon">📎</div><span id="fileName"></span><button type="button" class="file-remove" id="removeFileBtn">×</button></div><div class="input-row"><button type="button" class="control-btn" id="stopBtn" style="display:none">Stop</button><button type="button" class="control-btn" id="regenBtn" style="display:none">Regenerate</button><div class="input-wrapper"><input type="file" id="fileInput" style="display:none" accept=".pdf,.txt,.md,.py,.js,.ts,.jsx,.tsx,.html,.css,.csv,.json,.png,.jpg,.jpeg,.docx"><button type="button" class="upload-btn" id="uploadBtn" title="Attach file">📎</button><textarea id="userInput" placeholder="Ask Brain 3.0..." rows="1"></textarea></div><button type="submit" class="send-btn" id="sendBtn">Send</button></div></form></div></div></div></div>
<script src="/static/app.js"></script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').then(reg=>console.log('Brain 3.0 SW Registered:',reg.scope)).catch(err=>console.log('Brain 3.0 SW Registration Failed:',err))})}</script></body></html>
