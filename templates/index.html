<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b0f19">
<meta name="description" content="Brain 3.0 by B.CORP — AI assistant">
<title>Brain 3.0 — B.CORP</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0f19;color:#f5f7fb}
body{overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;width:100%;height:100vh;overflow:hidden}

.sidebar{width:280px;min-width:280px;background:#0f1420;border-right:1px solid #202738;display:flex;flex-direction:column;height:100%}
.sidebar-header{padding:18px 16px;border-bottom:1px solid #202738}
.brand{display:flex;align-items:center;gap:11px}
.brand-logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#6d5dfc,#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
.brand-text{display:flex;flex-direction:column}
.brand-title{font-size:16px;font-weight:750}
.brand-subtitle{font-size:11px;color:#8993a8;margin-top:2px}

.new-chat{margin:14px 14px 8px;border:1px solid #30394d;background:#151b29;color:#fff;border-radius:10px;padding:11px 13px;text-align:left;font-weight:600}
.new-chat:hover{background:#1b2333}

.chat-list{flex:1;overflow-y:auto;padding:8px}
.chat-item{padding:11px 12px;border-radius:9px;margin-bottom:4px;color:#c6ccda;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.chat-item:hover{background:#171e2c}
.chat-item.active{background:#1d2637;color:#fff}

.sidebar-footer{padding:12px;border-top:1px solid #202738}
.user-area{display:flex;align-items:center;gap:10px;padding:10px;border-radius:9px}
.user-avatar{width:34px;height:34px;border-radius:50%;background:#283247;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.user-info{min-width:0;flex:1}
.user-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-email{font-size:11px;color:#7f899c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.auth-button{border:0;background:transparent;color:#aeb7c8;padding:7px;border-radius:7px}
.auth-button:hover{background:#1a2130;color:#fff}

.main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;background:#0b0f19}
.topbar{height:60px;min-height:60px;border-bottom:1px solid #202738;display:flex;align-items:center;padding:0 18px;justify-content:space-between}
.mobile-menu{display:none;border:0;background:transparent;color:#cbd2df;font-size:22px}
.model-name{font-size:14px;font-weight:650}
.status{font-size:12px;color:#7e899d}

.chat-container{flex:1;min-height:0;overflow-y:auto}
.messages{max-width:900px;margin:0 auto;padding:28px 20px 150px}
.welcome{text-align:center;padding:90px 20px 40px;color:#aab3c4}
.welcome h1{font-size:30px;color:#fff;margin:0 0 10px}
.welcome p{margin:0;font-size:14px;line-height:1.7}

.message{display:flex;gap:12px;margin:0 0 24px}
.message.user{justify-content:flex-end}
.message-avatar{width:32px;height:32px;min-width:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:#202a3d;color:#dbe3f1}
.message.user .message-avatar{background:#3b82f6;color:#fff;order:2}
.message-content{max-width:min(760px,85%);line-height:1.65;font-size:15px}
.message.user .message-content{background:#1b2638;padding:11px 14px;border-radius:15px 15px 4px 15px}
.message.assistant .message-content{padding:3px 0}
.message-content p{margin:0 0 12px}
.message-content p:last-child{margin-bottom:0}
.message-content pre{background:#080b12;border:1px solid #242c3d;border-radius:10px;padding:14px;overflow-x:auto}
.message-content code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.message-content :not(pre)>code{background:#1a2130;padding:2px 5px;border-radius:5px;font-size:.9em}
.message-content ul,.message-content ol{padding-left:22px}
.message-content a{color:#73a7ff}
.message-content img{max-width:100%;border-radius:10px}

.composer-area{position:fixed;bottom:0;left:280px;right:0;background:linear-gradient(transparent,#0b0f19 25%);padding:28px 20px 18px}
.composer{max-width:900px;margin:auto;border:1px solid #30394d;background:#121825;border-radius:15px;box-shadow:0 8px 35px rgba(0,0,0,.25)}
.file-preview{display:none;padding:10px 14px;border-bottom:1px solid #252d3d;font-size:12px;color:#aeb7c8}
.composer-row{display:flex;align-items:flex-end;gap:8px;padding:10px}
.composer textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:#fff;min-height:42px;max-height:180px;padding:9px 5px;line-height:1.5}
.composer textarea::placeholder{color:#687389}
.icon-button{width:40px;height:40px;border:0;background:transparent;color:#9ca7ba;border-radius:9px;display:flex;align-items:center;justify-content:center}
.icon-button:hover{background:#1c2433;color:#fff}
.send-button{width:40px;height:40px;border:0;border-radius:10px;background:#3b82f6;color:#fff;font-weight:700}
.send-button:hover{background:#2563eb}
.send-button:disabled{opacity:.45;cursor:not-allowed}
.composer-note{max-width:900px;margin:7px auto 0;text-align:center;color:#626d81;font-size:10px}

.auth-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.auth-modal{width:min(420px,100%);background:#111725;border:1px solid #30394d;border-radius:16px;padding:24px;box-shadow:0 20px 70px rgba(0,0,0,.45)}
.auth-modal h2{margin:0 0 6px;font-size:22px}
.auth-modal p{margin:0 0 20px;color:#8994a8;font-size:13px}
.auth-form{display:flex;flex-direction:column;gap:12px}
.auth-form input{width:100%;border:1px solid #30394d;background:#0b101b;color:#fff;border-radius:9px;padding:12px;outline:0}
.auth-form input:focus{border-color:#4d8dff}
.auth-submit{border:0;background:#3b82f6;color:#fff;border-radius:9px;padding:12px;font-weight:650}
.auth-switch{border:0;background:transparent;color:#73a7ff;margin-top:13px}
.auth-close{float:right;border:0;background:transparent;color:#8994a8;font-size:20px}
.auth-error{color:#ff8e8e;font-size:12px;min-height:16px}

@media(max-width:760px){
.sidebar{position:fixed;left:-290px;top:0;z-index:900;transition:left .2s}
.sidebar.open{left:0}
.mobile-menu{display:block}
.composer-area{left:0;padding-left:12px;padding-right:12px}
.messages{padding-left:13px;padding-right:13px}
.topbar{padding:0 12px}
.message-content{max-width:90%}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="brand">
            <div class="brand-logo">B</div>
            <div class="brand-text">
                <div class="brand-title">Brain 3.0</div>
                <div class="brand-subtitle">by B.CORP</div>
            </div>
        </div>
    </div>

    <button class="new-chat" id="newChatButton">＋ New chat</button>

    <div class="chat-list" id="chatList"></div>

    <div class="sidebar-footer">
        <div class="user-area">
            <div class="user-avatar" id="userAvatar">?</div>
            <div class="user-info">
                <div class="user-name" id="userName">Guest</div>
                <div class="user-email" id="userEmail">Not signed in</div>
            </div>
            <button class="auth-button" id="authButton" type="button">Login</button>
        </div>
    </div>
</aside>

<main class="main">
    <header class="topbar">
        <button class="mobile-menu" id="mobileMenuButton" type="button">☰</button>

        <div>
            <div class="model-name">Brain 3.0</div>
            <div class="status" id="connectionStatus">Ready</div>
        </div>

        <div></div>
    </header>

    <section class="chat-container" id="chatContainer">
        <div class="messages" id="messages">
            <div class="welcome" id="welcomeMessage">
                <h1>How can I help?</h1>
                <p>Ask Brain 3.0 a question, upload a document, or start a new conversation.</p>
            </div>
        </div>
    </section>
</main>

<div class="composer-area">
    <div class="composer">

        <div class="file-preview" id="filePreview">
            <span id="fileName"></span>
            <button class="icon-button" id="removeFileButton" type="button">×</button>
        </div>

        <div class="composer-row">
            <button class="icon-button" id="attachButton" type="button" title="Attach file">＋</button>

            <input
                id="fileInput"
                type="file"
                hidden
                accept=".pdf,.txt,.md,.py,.js,.ts,.jsx,.tsx,.html,.css,.csv,.json,.png,.jpg,.jpeg,.docx"
            >

            <textarea
                id="messageInput"
                rows="1"
                placeholder="Message Brain 3.0..."
                autocomplete="off"
            ></textarea>

            <button class="send-button" id="sendButton" type="button" title="Send">↑</button>
        </div>
    </div>

    <div class="composer-note">
        Brain 3.0 can make mistakes. Verify important information.
    </div>
</div>

</div>

<div class="auth-overlay" id="authModal">
    <div class="auth-modal">

        <button class="auth-close" id="authCloseButton" type="button">×</button>

        <h2 id="authTitle">Welcome back</h2>
        <p id="authSubtitle">Sign in to continue using Brain 3.0.</p>

        <div class="auth-error" id="authError"></div>

        <form class="auth-form" id="loginForm">
            <input
                id="loginEmail"
                type="email"
                placeholder="Email"
                autocomplete="email"
                required
            >

            <input
                id="loginPassword"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <button class="auth-submit" type="submit">Sign in</button>
        </form>

        <form class="auth-form" id="signupForm" style="display:none">
            <input
                id="signupName"
                type="text"
                placeholder="Name"
                autocomplete="name"
                required
            >

            <input
                id="signupEmail"
                type="email"
                placeholder="Email"
                autocomplete="email"
                required
            >

            <input
                id="signupPassword"
                type="password"
                placeholder="Password"
                autocomplete="new-password"
                minlength="6"
                required
            >

            <button class="auth-submit" type="submit">Create account</button>
        </form>

        <button class="auth-switch" id="authSwitchButton" type="button">
            Create an account
        </button>

    </div>
</div>

<script src="/static/auth.js?v=10.2.0"></script>
<script src="/static/app.js?v=10.2.0"></script>

</body>
</html>
