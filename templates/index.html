<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Brain 3.0 by B.CORP - Nigeria's AI</title>
    
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
    <meta name="theme-color" content="#0A0A0F">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Brain 3.0">
    <link rel="apple-touch-icon" href="/static/icon-180.png">

    <script src="https://cdn.jsdelivr.net/npm/marked@14.1.2/lib/marked.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');
        :root { --bcorp-blue: #00BFFF; --bg: #0A0A0F; --card: #111118; --border: #23232F; --user: #1E40AF; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Space Grotesk', sans-serif; background: var(--bg); color: #F5F5F7; min-height: 100vh; display: flex; flex-direction: column; }

      .auth-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
      .auth-box { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 35px 30px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
      .auth-logo { text-align: center; margin-bottom: 25px; }
      .auth-logo.brain { font-size: 60px; filter: drop-shadow(0 0 20px var(--bcorp-blue)); animation: float 3s ease-in-out infinite; }
      .auth-box h2 { color: var(--bcorp-blue); text-align: center; margin-bottom: 8px; font-size: 24px; }
      .auth-subtitle { text-align: center; color: #A0A0B3; font-size: 13px; margin-bottom: 25px; }
      .auth-input { width: 100%; padding: 14px; margin-bottom: 14px; background: #0E0E14; border: 1px solid var(--border); border-radius: 12px; color: #e2e8f0; font-size: 15px; outline: none; }
      .auth-input:focus { border-color: var(--bcorp-blue); }
      .auth-btn { width: 100%; padding: 14px; margin-bottom: 10px; background: var(--bcorp-blue); color: #000; border: none; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; }
      .auth-btn.secondary { background: transparent; border: 1px solid var(--border); color: #F5F5F7; }
      .auth-error { color: #ef4444; font-size: 12px; text-align: center; margin-top: 10px; }

        #appContainer { display: none; flex-direction: column; height: 100vh; }
      .header { background: rgba(10,10,15,0.8); backdrop-filter: blur(10px); padding: 12px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
      .mode-select { background: #0E0E14; border: 1px solid var(--border); color: #F5F5F7; border-radius: 8px; padding: 6px 10px; }
      .chat-box { flex: 1; overflow-y: auto; padding: 20px 14px; max-width: 750px; margin: 0 auto; width: 100%; }
      .message { margin-bottom: 18px; padding: 14px 16px; border-radius: 18px; max-width: 85%; line-height: 1.6; }
      .user-msg { background: var(--user); margin-left: auto; border-bottom-right-radius: 4px; }
      .ai-msg { background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
      .typing::after { content: '▋'; animation: blink 1s infinite; color: var(--bcorp-blue); }
        @keyframes blink { 50% { opacity: 0; } }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); }

      .input-area { background: rgba(10,10,15,0.9); backdrop-filter: blur(10px); padding: 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
        input[type="text"] { flex: 1; padding: 14px; background: #0E0E14; border: 1px solid var(--border); border-radius: 12px; color: #e2e8f0; }
      .upload-btn { background: transparent; border: 1px solid var(--border); padding: 12px; border-radius: 12px; cursor: pointer; }
        button.send { padding: 14px 22px; background: var(--bcorp-blue); color: #000; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; }
        button:disabled { opacity: 0.5; }
      .logout-btn { background: #C62828; border: none; color: #fff; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
        pre { background: #09090F; padding: 12px; border-radius: 12px; overflow-x: auto; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="authScreen" class="auth-container">
        <div class="auth-box">
            <div class="auth-logo"><div class="brain">🧠</div></div>
            <h2>Welcome to Brain 3.0</h2>
            <p class="auth-subtitle">Nigeria's AI by B.CORP</p>
            <input type="email" id="email" class="auth-input" placeholder="Enter your email">
            <input type="password" id="password" class="auth-input" placeholder="Enter your password">
            <button class="auth-btn" onclick="signIn()">Login</button>
            <button class="auth-btn secondary" onclick="signUp()">Create Account</button>
            <div id="authError" class="auth-error"></div>
        </div>
    </div>

    <div id="appContainer">
        <div class="header">
            <div>
                <div style="font-size:14px; font-weight:600;">🧠 Brain 3.0 by B.CORP</div>
                <div style="font-size:12px; color:var(--bcorp-blue);" id="userEmail"></div>
            </div>
            <div style="display:flex; gap:8px; align-items:center;">
                <select id="modeSelect" class="mode-select">
                    <option value="pro">Pro Mode</option>
                    <option value="pidgin">Naija Mode</option>
                    <option value="code">Code Master</option>
                </select>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>
        <div class="chat-box" id="chatBox"></div>
        <div class="input-area">
            <input type="file" id="fileInput" accept="image/*,.pdf,.txt,.py,.js,.md" style="display:none">
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">📎</button>
            <input type="text" id="userInput" placeholder="Ask Brain 3.0 anything..."/>
            <button class="send" onclick="sendMessage()" id="sendBtn">Send</button>
        </div>
    </div>

    <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/sw.js').catch(err => console.log('SW failed:', err));
      });
    }

    let supabaseClient = null;
    let userId = null;
    let userEmail = null;
    let isSending = false;

    // FIX 1: MATCH BACKEND KEY NAMES
    fetch('/config')
  .then(res => res.json())
  .then(config => {
        supabaseClient = supabase.createClient(config.supabase_url, config.supabase_key) // CHANGED
        checkAuth();
    }).catch(e=>{
        document.getElementById('authError').innerText = "Config load failed. Check /config route";
    });

    function checkAuth() {
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if(session) {
                userId = session.user.id;
                userEmail = session.user.email;
                showApp();
            }
        });
    }

    function showApp() {
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('appContainer').style.display = 'flex';
        document.getElementById('userEmail').innerText = userEmail;
        addMessage('ai', `### Welcome back 👋\nI'm **Brain 3.0 by B.CORP**. Select a mode and ask me anything.`);
    }

    async function signUp() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        if(!email ||!password) { document.getElementById('authError').innerText = "Fill email and password"; return; }
        
        const { error } = await supabaseClient.auth.signUp({ email, password })
        if(error) document.getElementById('authError').innerText = error.message; 
        else alert('Account created! Now click Login.');
    }

    async function signIn() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        if(!email ||!password) { document.getElementById('authError').innerText = "Fill email and password"; return; }

        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password })
        if(error) document.getElementById('authError').innerText = error.message; 
        else { userId = data.user.id; userEmail = data.user.email; showApp(); }
    }

    async function logout() { await supabaseClient.auth.signOut(); location.reload(); }

    function addMessage(role, text) {
        const div = document.createElement('div');
        div.className = 'message ' + (role === 'user'? 'user-msg' : 'ai-msg');
        div.innerHTML = marked.parse(text);
        document.getElementById('chatBox').appendChild(div);
        document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
        return div;
    }

    async function sendMessage() {
        if (!userId || isSending) return; 
        isSending = true; document.getElementById('sendBtn').disabled = true;
        const input = document.getElementById('userInput'); 
        const message = input.value.trim(); 
        const file = document.getElementById('fileInput').files[0];
        const mode = document.getElementById('modeSelect').value;
        
        if (!message &&!file) { isSending = false; document.getElementById('sendBtn').disabled = false; return; }
        
        if(message) addMessage('user', message); 
        input.value = ''; 
        document.getElementById('fileInput').value = '';
        
        const botBox = addMessage('ai', '<span class="typing">Thinking...</span>'); 
        let fullAnswer = '';
        
        try {
            const formData = new FormData();
            formData.append('question', message); // FIX 2: Backend expects 'question' not 'message'
            formData.append('mode', mode);
            formData.append('user_id', userId);
            if(file) formData.append('file', file);

            const response = await fetch('/ask', { method: 'POST', body: formData });
            const reader = response.body.getReader(); 
            const decoder = new TextDecoder();
            while (true) {
                const {done, value} = await reader.read(); 
                if (done) break;
                let chunk = decoder.decode(value, {stream: true});
                if(chunk.startsWith('data: ')) chunk = chunk.replace('data: ', '');
                if(chunk.includes('[DONE]')) break;
                fullAnswer += chunk;
                botBox.innerHTML = marked.parse(fullAnswer);
                document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
            }
        } catch (e) { botBox.innerHTML = marked.parse('**Error:** ' + e.message); }
        document.getElementById('sendBtn').disabled = false; isSending = false;
    }
    document.getElementById('userInput').addEventListener('keypress', e => { if (e.key === 'Enter' &&!e.shiftKey) { e.preventDefault(); sendMessage(); } });
    </script>
  </body>
      </html>
