<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>B.CORP Brain 3.0 - Universal Tech AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #0f172a 0%, #020617 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
       .header {
            background: rgba(15,23,42,0.8);
            backdrop-filter: blur(10px);
            padding: 18px;
            border-bottom: 1px solid #1e293b;
            position: sticky;
            top: 0;
        }
        h1 {
            font-size: 20px;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 10px;
        }
       .subtitle {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }
       .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 24px 16px;
        }
       .message {
            margin-bottom: 18px;
            padding: 16px 20px;
            border-radius: 16px;
            max-width: 90%;
            line-height: 1.6;
            font-size: 15px;
        }
       .user-msg {
            background: #1e40af;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 6px;
        }
       .ai-msg {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
            border-bottom-left-radius: 6px;
        }
       .ai-msg code {
            background: #0f172a;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
        }
       .input-area {
            background: rgba(15,23,42,0.9);
            backdrop-filter: blur(10px);
            padding: 14px;
            border-top: 1px solid #1e293b;
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 14px;
            color: #e2e8f0;
            font-size: 16px;
            outline: none;
        }
        input:focus { border-color: #38bdf8; }
        button {
            padding: 16px 26px;
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        button:active { transform: scale(0.96); }
       .quick-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 12px 16px;
            background: rgba(15,23,42,0.6);
        }
       .quick-btn {
            padding: 10px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            color: #7dd3fc;
            font-size: 13px;
            text-align: center;
            cursor: pointer;
        }
       .quick-btn:active { background: #334155; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧠 B.CORP Brain 3.0</h1>
        <div class="subtitle">Universal Tech AI - Code, Debug, Explain, Build</div>
    </div>

    <div class="quick-grid">
        <div class="quick-btn" onclick="quickMsg('Explain Python list vs tuple')">Python Help</div>
        <div class="quick-btn" onclick="quickMsg('Fix this error: SyntaxError')">Debug Code</div>
        <div class="quick-btn" onclick="quickMsg('How does WiFi work?')">Tech Explain</div>
        <div class="quick-btn" onclick="quickMsg('Build HTML button')">Build With Me</div>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message ai-msg">
            <strong>Brain 3.0 Online</strong><br>
            Ask me anything about technology. Code, hardware, AI, internet, phones. 
            I explain + I build + I fix. Try a button above.
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask anything tech: 'What is API?'"/>
        <button onclick="sendMessage()" id="sendBtn">Send</button>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const btn = document.getElementById('sendBtn');
            const message = input.value.trim();
            if (!message) return;

            chatBox.innerHTML += `<div class="message user-msg">${message}</div>`;
            input.value = '';
            btn.disabled = true;
            chatBox.innerHTML += `<div class="message ai-msg" id="loading">Brain 3.0 thinking...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({question: message})
                });
                const data = await response.json();
                document.getElementById('loading').remove();
                chatBox.innerHTML += `<div class="message ai-msg">${data.answer}</div>`;
            } catch (e) {
                document.getElementById('loading').remove();
                chatBox.innerHTML += `<div class="message ai-msg">Connection error. Check internet.</div>`;
            }
            btn.disabled = false;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function quickMsg(text) {
            document.getElementById('userInput').value = text;
            sendMessage();
        }

        document.getElementById('userInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
  </html>
