<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Brain 3.0 by B.CORP - Nigeria's AI</title>
    
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
    <meta name="theme-color" content="#0A0A0F">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Brain 3.0">
    <link rel="apple-touch-icon" href="/static/icon-180.png">

    <script src="https://cdn.jsdelivr.net/npm/marked@14.1.2/lib/marked.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap');
        :root { --bcorp-blue: #00BFFF; --bg: #0A0A0F; --card: #0f172a; --border: #1e293b; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Space Grotesk', sans-serif; background: var(--bg); color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; }

        .auth-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .auth-box { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 35px 30px; box-shadow: 0 0 40px rgba(0,191,255,0.1); }
        .auth-logo { text-align: center; margin-bottom: 25px; }
        .auth-logo .brain { font-size: 60px; filter: drop-shadow(0 0 20px var(--bcorp-blue)); animation: float 3s ease-in-out infinite; }
        .auth-box h2 { color: var(--bcorp-blue); text-align: center; margin-bottom: 8px; font-size: 24px; }
        .auth-subtitle { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 25px; }
        .auth-input { width: 100%; padding: 14px; margin-bottom: 14px; background: #020617; border: 1px solid var(--border); border-radius: 12px; color: #e2e8f0; font-size: 15px; outline: none; }
        .auth-input:focus { border-color: var(--bcorp-blue); }
        .auth-btn { width: 100%; padding: 14px; margin-bottom: 10px; background: linear-gradient(135deg, var(--bcorp-blue) 0%, #0099cc 100%); color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; }
        .auth-btn.secondary { background: #1e293b; border: 1px solid var(--border); }
        .auth-error { color: #ef4444; font-size: 12px; text-align: center; margin-top: 10px; }

        #appContainer { display: none; flex-direction: column; height: 100vh; }
        .bcorp-face { text-align: center; padding: 30px 20px 15px; }
        .brain { font-size: 70px; animation: float 3s ease-in-out infinite; filter: drop-shadow(0 0 15px var(--bcorp-blue)); }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        h1 { color: var(--bcorp-blue); font-size: 32px; }

        .header { background: rgba(10,10,15,0.8); backdrop-filter: blur(10px); padding: 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .chat-box { flex: 1; overflow-y: auto; padding: 20px 14px; max-width: 750px; margin: 0 auto; width: 100%; }
        .message { margin-bottom: 18px; padding: 14px 16px; border-radius: 14px; max-width: 90%; line-height: 1.7; }
        .user-msg { background: #1e40af; margin-left: auto; }
        .ai-msg { background: var(--card); border: 1px solid var(--border); }
        .typing::after { content: '▋'; animation: blink 1s infinite; color: var(--bcorp-blue); }
        @keyframes blink { 50% { opacity: 0; } }

        .input-area { background: rgba(10,10,15,0.9); backdrop-filter: blur(10px); padding: 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
        input { flex: 1; padding: 14px; background: #020617; border: 1px solid var(--border); border-radius: 12px; color: #e2e8f0; }
        button { padding: 14px 22px; background: var(--bcorp-blue); color: white; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; }
        button:disabled { opacity: 0.5; }
        .logout-btn { background: transparent; border: 1px solid var(--bcorp-blue); color: var(--bcorp-blue); padding: 8px 14px; border-radius: 8px; }
    </style>
</head>
<body>
    <div id="authScreen" class="auth-container">
        <div class="auth-box">
            <div class="auth-logo"><div class="brain">🧠</div></div>
            <h2>Welcome to Brain 3.0</h2>
            <p class="auth-subtitle">Nigeria's AI by B.CORP</p>
            <input type="email" id="email" class="auth-input" placeholder="Enter your email">
            <input type="password" id="password" class="auth-input" placeholder="Enter your password">
            <button class="auth-btn" onclick="signIn()">Login</button>
            <button class="auth-btn secondary" onclick="signUp()">Create Account</button>
            <div id="authError" class="auth-error"></div>
        </div>
    </div>

    <div id="appContainer">
        <div class="bcorp-face">
            <div class="brain">🧠</div>
            <h1>B.CORP</h1>
            <p style="color:#888; font-size:12px;">Brain 3.0 • Nigeria's AI • 2026</p>
        </div>
        <div class="header">
            <div><div style="font-size:12px;">🧠 Brain 3.0</div><div style="font-size:12px; color:var(--bcorp-blue);" id="userEmail"></div></div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
        <div class="chat-box" id="chatBox"></div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask Brain 3.0 anything..."/>
            <button onclick="sendMessage()" id="sendBtn">Send</button>
        </div>
    </div>

    <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/sw.js').catch(err => console.log('SW failed:', err));
      });
    }

    let supabaseClient = null;
    let userId = null;
    let userEmail = null;
    let isSending = false;

    fetch('/config')
    .then(res => res.json())
    .then(config => {
        supabaseClient = supabase.createClient(config.supabase_url, config.supabase_key)
        checkAuth();
    });

    function checkAuth() {
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if(session) {
                userId = session.user.id;
                userEmail = session.user.email;
                showApp();
            }
        });
    }

    function showApp() {
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('appContainer').style.display = 'flex';
        document.getElementById('userEmail').innerText = userEmail;
        addMessage('ai', `### Welcome back\nI'm Brain 3.0 by B.CORP. Ask me anything.`);
    }

    async function signUp() {
        const { error } = await supabaseClient.auth.signUp({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        })
        if(error) document.getElementById('authError').innerText = error.message; 
        else alert('Account created! Login now.');
    }

    async function signIn() {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        })
        if(error) document.getElementById('authError').innerText = error.message; 
        else { userId = data.user.id; userEmail = data.user.email; showApp(); }
    }

    async function logout() { await supabaseClient.auth.signOut(); location.reload(); }

    function addMessage(role, text) {
        const div = document.createElement('div');
        div.className = 'message ' + (role === 'user'? 'user-msg' : 'ai-msg');
        div.innerHTML = marked.parse(text);
        document.getElementById('chatBox').appendChild(div);
        document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
        return div;
    }

    async function sendMessage() {
        if (!userId || isSending) return; 
        isSending = true; document.getElementById('sendBtn').disabled = true;
        const input = document.getElementById('userInput'); 
        const message = input.value.trim(); 
        if (!message) { isSending = false; document.getElementById('sendBtn').disabled = false; return; }
        
        addMessage('user', message); input.value = ''; 
        const botBox = addMessage('ai', '<span class="typing">Thinking...</span>'); let fullAnswer = '';
        
        try {
            const formData = new FormData();
            formData.append('question', message);
            formData.append('mode', 'pro');
            formData.append('user_name', userEmail);
            formData.append('user_id', userId);

            const response = await fetch('/ask', { method: 'POST', body: formData });
            const reader = response.body.getReader(); const decoder = new TextDecoder();
            while (true) {
                const {done, value} = await reader.read(); if (done) break;
                const chunk = decoder.decode(value); const lines = chunk.split('\n');
                for (const line of lines) { if (line.startsWith('data: ')) {
                    const text = line.replace('data: ', '');
                    if (text === '[DONE]') { botBox.innerHTML = marked.parse(fullAnswer); }
                    else { fullAnswer += text; botBox.innerHTML = marked.parse(fullAnswer); }
                }}
            }
        } catch (e) { botBox.innerHTML = 'Error: ' + e.message; }
        document.getElementById('sendBtn').disabled = false; isSending = false;
    }
    document.getElementById('userInput').addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
    </script>
  </body>
  </html>
