<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Brain 3.0 - AI Assistant by B.CORP v3.5.6</title>
    <link rel="manifest" href="/static/manifest.json?v=40">
    <meta name="theme-color" content="#0A0A0F">
    <script src="https://cdn.jsdelivr.net/npm/marked@14.1.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap');
        :root { --bcorp-blue: #00BFFF; --bg: #0A0A0F; --card: #111827; --border: #1e293b; --user: #1e40af; --text: #FFFFFF; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }
        .auth-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; width: 100%; }
        .auth-box { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 35px 30px; box-shadow: 0 0 40px rgba(0,191,255,0.15); }
        .brain { font-size: 60px; text-align:center; filter: drop-shadow(0 0 20px var(--bcorp-blue)); animation: float 3s ease-in-out infinite; margin-bottom: 20px; }
        .auth-box h2 { color: var(--bcorp-blue); text-align: center; margin-bottom: 8px; font-size: 24px; font-family: 'Space Grotesk'; }
        .auth-subtitle { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 25px; }
        .auth-input { width: 100%; padding: 14px; margin-bottom: 14px; background: #020617; border: 1px solid var(--border); border-radius: 12px; color: #e2e8f0; font-size: 15px; outline: none; }
        .auth-btn { width: 100%; padding: 14px; margin-bottom: 10px; background: linear-gradient(135deg, var(--bcorp-blue) 0%, #0099cc 100%); color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s; }
        .auth-btn:hover { transform: scale(1.02); box-shadow: 0 0 15px var(--bcorp-blue); }
        .auth-btn.secondary { background: #1e293b; border: 1px solid var(--border); }
        .auth-error { color: #ef4444; text-align: center; font-size: 13px; margin-top: 10px; min-height: 20px; }
        .sidebar { position: fixed; left: 0; top: 0; width: 260px; height: 100vh; background: #0A0A0F; border-right: 1px solid var(--border); padding: 20px 10px; overflow-y: auto; z-index: 200; transition: transform 0.3s; display: none; }
        .sidebar.hidden { transform: translateX(-100%); }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .close-sidebar { display: none; font-size: 20px; color: var(--bcorp-blue); cursor: pointer; padding: 6px 10px; }
        .new-chat-btn { width: 100%; padding: 12px; background: var(--bcorp-blue); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; margin-bottom: 20px; }
        .chat-item { padding: 12px; border-radius: 8px; cursor: pointer; margin-bottom: 5px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; justify-content: space-between; align-items: center; }
        .chat-item:hover,.chat-item.active { background: #1e293b; }
        .chat-delete { opacity: 0; cursor: pointer; color: #ef4444; }
        .chat-item:hover .chat-delete { opacity: 1; }
        #appContainer { display: none; flex-direction: column; flex: 1; margin-left: 260px; height: 100vh; }
        .bcorp-face { text-align: center; padding: 30px 20px 15px; }
        .brain.big { font-size: 70px; }
        h1 { color: var(--bcorp-blue); font-size: 32px; font-family: 'Space Grotesk'; text-align:center; }
        .header { background: rgba(10,10,15,0.85); backdrop-filter: blur(12px); padding: 12px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
        .hamburger { display: none; font-size: 24px; cursor: pointer; color: var(--bcorp-blue); }
        .chat-box { flex: 1; overflow-y: auto; padding: 20px 14px 100px; max-width: 750px; margin: 0 auto; width: 100%; }
        .message { margin-bottom: 14px; padding: 16px 18px; border-radius: 16px; max-width: 95%; line-height: 1.7; font-size: 15px; animation: fadeIn 0.3s ease; position: relative; }
        .user-msg { background: var(--user); margin-left: auto; border-bottom-right-radius: 4px; white-space: pre-wrap; color: #fff; }
        .ai-msg { background: linear-gradient(145deg, #111827 0%, #0f172a 100%); border: 1px solid var(--border); border-bottom-left-radius: 4px; color: #FFFFFF!important; overflow-wrap: break-word; word-break: break-word; box-shadow: 0 0 12px rgba(0,191,255,0.08); line-height: 1.8; letter-spacing: 0.2px; }
        .ai-msg * { color: #FFFFFF!important; }
        .ai-msg h1,.ai-msg h2,.ai-msg h3,.ai-msg h4 { font-family: 'Space Grotesk'; color: var(--bcorp-blue)!important; margin: 14px 0 8px; font-weight: 700; }
        .ai-msg strong { color: var(--bcorp-blue)!important; font-weight: 700; }
        .ai-msg ul,.ai-msg ol { margin: 8px 0 8px 20px; }
        .ai-msg li { margin-bottom: 6px; }
        .typing::after { content: '▋'; animation: blink 1s infinite; color: var(--bcorp-blue); }
        .copy-btn { position: absolute; top: 8px; right: 8px; background: #020617; border: 1px solid var(--border); color: var(--bcorp-blue); padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; opacity: 0; transition: 0.2s; }
        .ai-msg:hover .copy-btn { opacity: 1; }
        .controls { display: flex; gap: 10px; padding: 0 14px 10px; max-width: 750px; margin: 0 auto; width: 100%; justify-content: center; }
        .control-btn { padding: 10px 16px; background: #020617; border: 1px solid var(--border); border-radius: 10px; color: var(--bcorp-blue); cursor: pointer; font-size: 14px; display: none; }
        .control-btn:hover { border-color: var(--bcorp-blue); }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        @keyframes blink { 50% { opacity: 0; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .input-area { background: rgba(10,10,15,0.95); backdrop-filter: blur(12px); padding: 14px; border-top: 1px solid var(--border); display: flex; gap: 12px; align-items: center; position: fixed; bottom: 0; left: 260px; right: 0; max-width: calc(750px + 260px); margin: 0 auto; z-index: 100; }
        #userInput { flex: 1; padding: 16px 14px; background: #020617; border: 1px solid var(--border); border-radius: 14px; color: #e2e8f0; font-size: 16px; outline: none; min-height: 52px; }
        #userInput:focus { border-color: var(--bcorp-blue); box-shadow: 0 0 0 2px rgba(0,191,255,0.2); }
        .upload-btn { padding: 14px; background: #020617; border: 1px solid var(--border); border-radius: 14px; cursor: pointer; font-size: 20px; min-width: 52px; min-height: 52px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .upload-btn:hover { border-color: var(--bcorp-blue); }
        .send-btn { padding: 16px 28px; background: linear-gradient(135deg, var(--bcorp-blue) 0%, #0099cc 100%); color: white; border: none; border-radius: 14px; font-weight: 700; cursor: pointer; font-size: 16px; min-width: 95px; min-height: 52px; transition: all 0.2s; box-shadow: 0 0 15px rgba(0,191,255,0.3); font-family: 'Space Grotesk'; display: flex; align-items: center; justify-content: center; }
        .send-btn:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(0,191,255,0.6); }
        .send-btn:active { transform: scale(0.95); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: scale(1); }
        .logout-btn { background: transparent; border: 1px solid var(--bcorp-blue); color: var(--bcorp-blue); padding: 8px 14px; border-radius: 8px; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .logout-btn:hover { background: var(--bcorp-blue); color: white; }
        @media (max-width: 768px) {
        .sidebar { transform: translateX(-100%); display: none; }
        .sidebar.show { transform: translateX(0); display: block; }
        .close-sidebar { display: block; }
        #appContainer { margin-left: 0; }
        .input-area { left: 0; max-width: 100%; }
        .hamburger { display: block; }
        .send-btn { min-width: 80px; padding: 16px 20px; font-size: 15px; }
        .input-area { padding: 12px; gap: 8px; }
        }
    </style>
</head>
<body>
    <div id="authScreen" class="auth-container">
        <div class="auth-box">
            <div class="brain">🧠</div>
            <h2>Welcome to Brain 3.0</h2>
            <p class="auth-subtitle">AI Assistant by B.CORP</p>
            <input type="email" id="email" class="auth-input" placeholder="Enter your email" autocomplete="email">
            <input type="password" id="password" class="auth-input" placeholder="Enter your password" autocomplete="current-password">
            <button class="auth-btn" id="loginBtn">Login</button>
            <button class="auth-btn secondary" id="signupBtn">Create Account</button>
            <div id="authError" class="auth-error"></div>
        </div>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" id="newChatBtn">+ New Chat</button>
            <div class="close-sidebar" id="closeSidebarBtn">✕</div>
        </div>
        <div id="chatList"></div>
    </div>

    <div id="appContainer">
        <div class="bcorp-face">
            <div class="brain big">🧠</div>
            <h1>B.CORP</h1>
            <p style="color:#888; font-size:12px; text-align:center;">Brain 3.0 • AI Assistant • 2026</p>
        </div>
        <div class="header">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div class="hamburger" id="hamburgerBtn">☰</div>
                <div><div style="font-size:12px;">🧠 Brain 3.0</div><div style="font-size:12px; color:var(--bcorp-blue);" id="userEmail"></div></div>
            </div>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
        <div class="chat-box" id="chatBox"></div>
        <div class="controls">
            <button class="control-btn" id="stopBtn">⏹ Stop</button>
            <button class="control-btn" id="regenBtn">🔄 Regenerate</button>
        </div>
        <div class="input-area">
            <input type="file" id="fileInput" accept=".pdf,.txt,.py,.js,.md" style="display:none">
            <button class="upload-btn" id="uploadBtn">📎</button>
            <input type="text" id="userInput" placeholder="Ask Brain 3.0 anything..."/>
            <button class="send-btn" id="sendBtn">Send</button>
        </div>
    </div>
    <script src="/static/app.js?v=42"></script>
</body>
</html>
