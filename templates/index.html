<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><meta name="theme-color" content="#070A10"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Brain 3.0"><title>Brain 3.0 — B.CORP AI</title><link rel="manifest" href="/static/manifest.json"><link rel="apple-touch-icon" href="/static/icon-180.png"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@14.1.2/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script><style>:root{--bg:#070A10;--panel:#0D131E;--line:rgba(148,163,184,.12);--line2:rgba(148,163,184,.18);--blue:#00BFFF;--text:#F8FAFC;--text2:#CBD5E1;--muted:#718096;--green:#22C55E;--red:#EF4444;--sidebar:270px;--content:900px}*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;background:var(--bg)}body{color:var(--text);font-family:Inter,sans-serif;overflow:hidden}button,input,textarea{font:inherit}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#243247;border-radius:20px}

#authScreen{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;background:#070A10}.auth-glow{position:absolute;width:420px;height:420px;border-radius:50%;filter:blur(110px);opacity:.16}.auth-glow.one{background:#00BFFF;top:-230px;left:-130px}.auth-glow.two{background:#1647FF;right:-200px;bottom:-230px}.auth-grid{position:absolute;inset:0;opacity:.25;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:45px 45px}.auth-card{position:relative;width:min(430px,100%);padding:40px;border:1px solid var(--line2);border-radius:28px;background:rgba(13,19,30,.82);backdrop-filter:blur(30px)}.auth-logo{width:86px;height:86px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;border-radius:25px;background:radial-gradient(circle at 30% 20%,rgba(0,191,255,.25),rgba(0,71,255,.08) 50%,transparent 70%)}.auth-logo img{width:76px;height:76px;filter:drop-shadow(0 0 18px rgba(0,191,255,.4));animation:float 4s ease-in-out infinite}.auth-brand{text-align:center;font-family:"Space Grotesk",sans-serif;font-size:34px;font-weight:700;background:linear-gradient(90deg,#fff,#71DCFF);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.auth-version{text-align:center;margin-top:6px;color:var(--muted);font-size:11px}.auth-subtitle{margin:25px 0 18px;text-align:center;color:var(--text2);font-size:14px}.auth-input{width:100%;height:52px;margin:6px 0;padding:0 15px;border:1px solid var(--line2);border-radius:13px;background:#080D15;color:var(--text)}.auth-input:focus{border-color:rgba(0,191,255,.65)}.auth-btn{width:100%;height:52px;margin-top:9px;border:0;border-radius:13px;cursor:pointer;color:white;font-family:"Space Grotesk",sans-serif;font-weight:700;background:linear-gradient(135deg,#1647FF,#00BFFF)}.auth-btn.secondary{color:var(--text2);background:#121B28}.auth-btn:disabled{opacity:.5}.auth-error{min-height:18px;margin-top:12px;color:#F87171;text-align:center;font-size:12px}.auth-status{min-height:18px;margin-top:5px;color:var(--muted);text-align:center;font-size:11px}

#chatContainer{position:relative;width:100%;height:100dvh;display:none}.sidebar{position:fixed;left:0;top:0;bottom:0;z-index:500;width:var(--sidebar);padding:15px 12px;display:flex;flex-direction:column;background:linear-gradient(180deg,#090D15 0%,#070A10 100%);border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .3s ease}.sidebar.show{transform:translateX(0)}.sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:5px 7px 18px}.brand{display:flex;align-items:center;gap:10px}.brand-logo{width:35px;height:35px;filter:drop-shadow(0 0 12px rgba(0,191,255,.35))}.brand-text{font-family:"Space Grotesk",sans-serif;font-size:17px;font-weight:700}.brand-text span{display:block;color:#526174;font-size:9px}.close-sidebar{display:none;width:34px;height:34px;border:1px solid var(--line);border-radius:9px;color:var(--muted);background:#0D141F;cursor:pointer}.new-chat-btn{width:100%;height:46px;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid rgba(0,191,255,.22);border-radius:13px;color:#fff;background:linear-gradient(135deg,rgba(22,71,255,.9),rgba(0,191,255,.85));cursor:pointer;font-family:"Space Grotesk",sans-serif;font-weight:700}.sidebar-label{margin:22px 7px 9px;color:#526174;font-size:9px;font-weight:700;text-transform:uppercase}#chatList{flex:1;overflow-y:auto}.chat-item{width:100%;display:flex;align-items:center;gap:9px;margin-bottom:3px;padding:10px;border-radius:10px;color:#94A3B8;cursor:pointer;font-size:12px}.chat-item:hover,.chat-item.active{color:#fff;background:#101925}.chat-item-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chat-delete{opacity:0;padding:4px;border:0;color:#64748B;background:transparent;cursor:pointer}.chat-item:hover .chat-delete{opacity:1}.user-profile{display:flex;align-items:center;gap:9px;margin-top:12px;padding:10px;border-top:1px solid var(--line)}.user-avatar{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:11px;color:#fff;background:linear-gradient(135deg,#1647FF,#00BFFF);font-size:12px;font-weight:700}.user-email{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#94A3B8;font-size:10px}.logout-btn{padding:7px;border:0;color:#718096;background:transparent;cursor:pointer;font-size:11px}.sidebar-overlay{display:none;position:fixed;inset:0;z-index:450;background:rgba(0,0,0,.68);backdrop-filter:blur(3px)}.sidebar-overlay.show{display:block}

#appContainer{position:relative;width:100%;height:100dvh;margin-left:0;display:flex;flex-direction:column}@media (min-width:769px){.sidebar{transform:translateX(0)}#appContainer{margin-left:var(--sidebar)}.hamburger{display:none}.close-sidebar{display:none}}@media (max-width:768px){.close-sidebar{display:block}}

.topbar{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(7,10,16,.78);backdrop-filter:blur(20px)}.topbar-left{display:flex;align-items:center;gap:11px}.hamburger{display:none;width:38px;height:38px;align-items:center;justify-content:center;border:1px solid var(--line2);border-radius:10px;color:#fff;background:#101824;cursor:pointer;font-size:18px}@media (max-width:768px){.hamburger{display:flex}}.top-title{font-family:"Space Grotesk",sans-serif;font-size:15px;font-weight:700}.top-subtitle{display:flex;align-items:center;gap:6px;margin-top:2px;color:#526174;font-size:9px}.status-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}.topbar-badge{padding:6px 10px;border:1px solid rgba(0,191,255,.16);border-radius:20px;color:#70DFFF;background:rgba(0,191,255,.05);font-size:9px;font-weight:700}

.chat-box{flex:1;overflow-y:auto;padding:20px 24px 170px}.chat-inner{width:100%;max-width:var(--content);margin:0 auto}

.message-wrap{width:100%;margin-bottom:27px}.message-row{display:flex;align-items:flex-start;gap:11px}.message-row.user{justify-content:flex-end}.message-avatar{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line2);border-radius:11px;background:#101925;color:#fff;font-size:11px;font-weight:700}.user-avatar-small{background:linear-gradient(135deg,#1647FF,#0077FF)}.ai-avatar{background:radial-gradient(circle at 30% 30%,#00BFFF,#1647FF)}.message{max-width:min(780px,85%);padding:13px 16px;border-radius:17px;font-size:14px;line-height:1.7;animation:messageIn .2s ease}.user-msg{color:#fff;background:linear-gradient(135deg,#1746B5,#0759DB);border-bottom-right-radius:5px;white-space:pre-wrap}.ai-msg{color:#E7EDF5;background:#0F1723;border:1px solid var(--line);border-bottom-left-radius:5px}.ai-msg pre{margin:13px 0;padding:14px;overflow-x:auto;border:1px solid #1D2B3E;border-radius:11px;background:#05090F}.ai-msg code{background:#080D14;color:#7DD3FC;padding:2px 5px;border-radius:5px}.agent-banner{display:inline-flex;align-items:center;gap:6px;margin-bottom:9px;padding:6px 9px;border:1px solid rgba(0,191,255,.17);border-radius:8px;color:#73DFFF;background:rgba(0,191,255,.055);font-size:9px;font-weight:700}.sources{margin-top:15px;padding:12px;border:1px solid var(--line);border-radius:11px;background:#080E16}.sources-title{margin-bottom:7px;color:#94A3B8;font-size:10px;font-weight:700}.source-card{padding:4px 0;font-size:11px}.source-card a{color:#55D8FF}.copy-row{display:flex;gap:5px;margin:5px 0 0 45px}.copy-btn{padding:5px 8px;border:1px solid transparent;border-radius:7px;color:#64748B;background:transparent;cursor:pointer;font-size:10px}.copy-btn:hover{color:#DCE5EF;background:#111A27}

#filePreview{display:none;margin-bottom:8px}.file-preview{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line2);border-radius:11px;background:#0B121C}.file-preview-icon{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:rgba(0,191,255,.07)}.file-preview span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#CBD5E1;font-size:11px}.file-remove{border:0;background:transparent;color:#718096;cursor:pointer;font-size:18px}

.input-shell{position:absolute;left:0;right:0;bottom:0;z-index:150;padding:14px 22px 18px;background:linear-gradient(180deg,transparent,rgba(7,10,16,.88) 35%)}.input-area{width:100%;max-width:var(--content);margin:0 auto;display:flex;gap:10px;align-items:flex-end;flex-direction:column}.input-row{display:flex;gap:10px;width:100%}.input-wrapper{flex:1;display:flex;align-items:center;background:#080D15;border:1px solid var(--line2);border-radius:16px;padding:0 6px 0 16px}#userInput{flex:1;padding:16px 10px;background:transparent;border:none;color:#e2e8f0;font-size:16px;outline:none;resize:none;max-height:200px}.upload-btn{padding:10px;background:transparent;border:none;cursor:pointer;font-size:20px;color:#64748b}.control-btn{padding:10px 14px;background:#121B28;color:var(--text);border:1px solid var(--line);border-radius:10px;font-weight:600;cursor:pointer;font-size:13px}.send-btn{padding:14px 24px;background:linear-gradient(135deg,#1647FF,#00BFFF);color:#fff;border:none;border-radius:12px;font-weight:700;font-family:"Space Grotesk",sans-serif}.send-btn:disabled{opacity:.5}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes messageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1}}</style></head><body>
<div id="authScreen"><div class="auth-glow one"></div><div class="auth-glow two"></div><div class="auth-grid"></div><div class="auth-card"><div class="auth-logo"><img src="/static/brain3d.png" alt="Brain"></div><h1 class="auth-brand">Brain 3.0</h1><p class="auth-version">B.CORP AI • 2026</p><p class="auth-subtitle">Sign in to continue</p><input id="emailInput" type="email" placeholder="Email" class="auth-input" autocomplete="email"><input id="passwordInput" type="password" placeholder="Password" class="auth-input" autocomplete="current-password"><button id="loginBtn" class="auth-btn">Sign In</button><button id="signupBtn" class="auth-btn secondary">Create Account</button><p id="authError" class="auth-error"></p><p id="authStatus" class="auth-status">Loading authentication...</p></div></div>
<div id="chatContainer"><div class="app-shell"><div class="sidebar" id="sidebar"><div class="sidebar-header"><div class="brand"><img src="/static/brain3d.png" class="brand-logo"><div class="brand-text">Brain 3.0<span>B.CORP AI</span></div></div><button class="close-sidebar" id="closeSidebarBtn">✕</button></div><button class="new-chat-btn" id="newChatBtn">+ New Chat</button><div class="sidebar-label">Recent</div><div id="chatList"></div><div class="user-profile"><div class="user-avatar" id="userAvatar">U</div><div class="user-email" id="userEmailDisplay"></div><button class="logout-btn" id="logoutBtn">Logout</button></div></div><div class="sidebar-overlay" id="sidebarOverlay"></div>
<div id="appContainer"><div class="topbar"><div class="topbar-left"><button class="hamburger" id="hamburgerBtn">☰</button><div><div class="top-title">Brain 3.0</div><div class="top-subtitle"><span class="status-dot"></span>Online</div></div></div><div class="topbar-badge">B.CORP</div></div>
<div class="chat-box" id="chatBox"><div class="chat-inner"></div></div>
<div class="input-shell"><form id="chatForm" class="input-area"><div id="filePreview" class="file-preview"><div class="file-preview-icon">📎</div><span id="fileName"></span><button type="button" class="file-remove" id="removeFileBtn">×</button></div><div class="input-row"><button type="button" class="control-btn" id="stopBtn" style="display:none">Stop</button><button type="button" class="control-btn" id="regenBtn" style="display:none">Regenerate</button><div class="input-wrapper"><input type="file" id="fileInput" style="display:none" accept=".pdf,.txt,.md,.py,.js,.ts,.jsx,.tsx,.html,.css,.csv,.json,.png,.jpg,.jpeg,.docx"><button type="button" class="upload-btn" id="uploadBtn" title="Attach file">📎</button><textarea id="userInput" placeholder="Ask Brain 3.0..." rows="1"></textarea></div><button type="submit" class="send-btn" id="sendBtn">Send</button></div></form></div></div></div></div>
<script src="/static/auth.js"></script><script src="/static/app.js"></script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').then(reg=>console.log('Brain 3.0 SW Registered:',reg.scope)).catch(err=>console.log('Brain 3.0 SW Registration Failed:',err))})}</script></body></html>
