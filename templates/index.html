<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Brain 3.0 - AI Assistant by B.CORP v4.13</title>
    <link rel="manifest" href="/static/manifest.json?v=79">
    <meta name="theme-color" content="#0A0A0F">
    <script src="https://cdn.jsdelivr.net/npm/marked@14.1.2/marked.min.js"></script>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="close-sidebar" id="closeSidebarBtn">✕</div>
        <button type="button" class="new-chat-btn" id="newChatBtn">+ New Chat</button>
        <div id="chatList" style="flex:1; overflow-y:auto;"></div>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div id="appContainer">
        <button type="button" class="hamburger" id="hamburgerBtn">☰</button>
        <div class="hero-top">
            <img src="/static/brain3d.png" class="brain-img big" alt="B.CORP Brain 3.0">
            <h1 class="bcorp-title">B.CORP</h1>
            <p class="bcorp-subtitle">Brain 3.0 • AI Assistant • 2026</p>
        </div>
        <div class="brain-label"><img src="/static/brain3d.png" alt="Brain 3.0"><span>Brain 3.0</span></div>
        <div class="chat-box" id="chatBox"></div>
        <div class="controls">
            <button type="button" class="control-btn" id="stopBtn">⏹ Stop</button>
            <button type="button" class="control-btn" id="regenBtn">🔄 Regenerate</button>
        </div>
        <form id="chatForm" class="input-area">
            <input type="file" id="fileInput" accept=".pdf,.txt,.py,.js,.ts,.jsx,.tsx,.html,.css,.md,.csv,.json,.png,.jpg,.jpeg,.docx" style="display:none">
            <div class="input-wrapper">
                <button type="button" class="upload-btn" id="uploadBtn" aria-label="Attach file" title="Attach file">📎</button>
                <input type="text" id="userInput" placeholder="Ask Brain 3.0 anything..." autocomplete="off" autocapitalize="sentences" spellcheck="true" enterkeyhint="send" aria-label="Message Brain 3.0"/>
            </div>
            <button type="submit" class="send-btn" id="sendBtn">Send</button>
        </form>
    </div>

    <script src="/static/app.js?v=79" defer></script>

    <!-- SW AT ROOT FOR FULL APP SCOPE -->
    <script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("/sw.js") // FIX: /sw.js not /static/sw.js
           .then(registration => console.log("Brain 3.0 SW registered:", registration.scope))
           .catch(error => console.error("Brain 3.0 SW registration failed:", error));
        });
    }
    </script>

    <style> /* Same CSS as before - keep all of it */ 
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap');
        :root { --bcorp-blue: #00BFFF; --bg: #0A0A0F; --card: #131a2a; --border: #1e293b; --user: linear-gradient(135deg, #0047ff 0%, #0077ff 100%); --text: #FFFFFF; --sidebar-w: 260px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; display: flex; }
       .sidebar { position: fixed; left: 0; top: 0; width: var(--sidebar-w); height: 100dvh; background: #0A0A0F; border-right: 1px solid var(--border); padding: 16px 10px; overflow-y: auto; z-index: 200; transition: transform 0.3s ease; display: flex; flex-direction: column; transform: translateX(-100%); }
       .sidebar.show { transform: translateX(0); }
       .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 199; backdrop-filter: blur(2px); }
       .sidebar-overlay.show { display: block; }
       .close-sidebar { display: none; font-size: 24px; color: var(--bcorp-blue); cursor: pointer; padding: 6px 10px; position: absolute; right: 10px; top: 10px; }
       .new-chat-btn { width: 100%; padding: 12px; background: var(--bcorp-blue); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; margin-bottom: 20px; font-size: 15px; font-family: 'Space Grotesk'; transition: 0.2s; }
       .new-chat-btn:hover { box-shadow: 0 0 15px var(--bcorp-blue); transform: translateY(-1px); }
       .chat-item { padding: 12px; border-radius: 8px; cursor: pointer; margin-bottom: 5px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; transition: 0.2s; }
       .chat-item span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
       .chat-item:hover,.chat-item.active { background: #1e293b; }
       .chat-delete { opacity: 0; cursor: pointer; color: #ef4444; padding: 4px 8px; font-size: 18px; flex-shrink: 0; border-radius: 4px; transition: 0.2s; }
       .chat-item:hover .chat-delete { opacity: 1; }
        #appContainer { display: flex!important; flex-direction: column; flex: 1; margin-left: 0; height: 100dvh; position: relative; }
        @media (min-width: 769px) { .sidebar { transform: translateX(0); } #appContainer { margin-left: var(--sidebar-w); } .sidebar-overlay { display: none!important; } .close-sidebar { display: none!important; } .hamburger { display: none!important; } }
       .hero-top { text-align: center; padding: 30px 20px 15px; border-bottom: 1px solid var(--border); max-width: 800px; margin: 0 auto; width: 100%; }
       .brain-img.big { width: 110px; height: 110px; animation: float 3s ease-in-out infinite; filter: drop-shadow(0 0 30px var(--bcorp-blue)); margin-bottom: 10px; }
       .bcorp-title { font-family: 'Space Grotesk'; font-size: 38px; font-weight: 700; background: linear-gradient(90deg, #00BFFF, #4FC3F7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0 0 5px; }
       .bcorp-subtitle { color:#888; font-size:13px; text-align:center; letter-spacing: 0.5px; }
       .brain-label { display: flex; align-items: center; gap: 8px; padding: 12px 18px; border-bottom: 1px solid var(--border); font-size: 14px; font-weight: 500; max-width: 800px; margin: 0 auto; width: 100%; }
       .brain-label img { width: 20px; height: 20px; }
       .hamburger { display: none; font-size: 24px; cursor: pointer; color: var(--bcorp-blue); position: fixed; top: 15px; left: 15px; z-index: 300; background: #131a2a; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); }
       .chat-box { flex: 1; overflow-y: auto; padding: 20px 14px 140px; max-width: 800px; margin: 0 auto; width: 100%; scroll-behavior: smooth; }
       .message-wrap { display: flex; gap: 10px; margin-bottom: 16px; align-items: flex-start; }
       .message-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
       .message-avatar img { width: 24px; height: 24px; }
       .message { padding: 14px 16px; border-radius: 18px; max-width: 85%; line-height: 1.65; font-size: 15px; animation: fadeIn 0.3s ease; position: relative; word-wrap: break-word; overflow-wrap: break-word; }
       .user-msg { background: var(--user); margin-left: auto; border-bottom-right-radius: 4px; color: #fff; white-space: pre-wrap; }
       .ai-msg { background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; color: #FFFFFF; }
       .agent-banner { background: linear-gradient(90deg, rgba(0,191,255,0.15), rgba(0,119,255,0.15)); border: 1px solid var(--bcorp-blue); color: var(--bcorp-blue); padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; margin-bottom: 12px; font-family: 'Space Grotesk'; }
       .ai-msg h3 { color: var(--bcorp-blue); font-family: 'Space Grotesk'; margin: 16px 0 10px; font-size: 17px; }
       .ai-msg p { margin: 8px 0; }
       .ai-msg ul,.ai-msg ol { margin: 8px 0 8px 20px; }
       .ai-msg strong { color: var(--bcorp-blue); font-weight: 600; }
       .ai-msg pre { background: #020617; padding: 14px; border-radius: 10px; overflow-x: auto; margin: 12px 0; border: 1px solid var(--border); white-space: pre; max-width: 100%; }
       .ai-msg pre code { white-space: pre; display: block; min-width: max-content; }
       .ai-msg code { font-family: 'Consolas', monospace; font-size: 13px; }
       .sources { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
       .sources b { font-family: 'Space Grotesk'; color: var(--bcorp-blue); }
       .source-card { background: #020617; border: 1px solid var(--border); padding: 10px 12px; border-radius: 10px; margin: 8px 0; transition: 0.2s; }
       .source-card a { color: var(--bcorp-blue); text-decoration: none; font-size: 13px; font-weight: 500; }
       .msg-meta { font-size: 11px; color: #64748b; margin-top: 8px; }
       .copy-btn { position: absolute; top: 8px; right: 8px; background: #020617; border: 1px solid var(--border); color: var(--bcorp-blue); padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; opacity: 0; transition: 0.2s; }
       .ai-msg:hover .copy-btn { opacity: 1; }
       .controls { display: flex; gap: 10px; padding: 0 14px 10px; max-width: 800px; margin: 0 auto; width: 100%; justify-content: center; }
       .control-btn { padding: 10px 16px; background: #020617; border: 1px solid var(--border); border-radius: 10px; color: var(--bcorp-blue); cursor: pointer; font-size: 14px; display: none; font-weight: 500; }
       .input-area { background: rgba(10,10,15,0.95); backdrop-filter: blur(12px); padding: 14px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: min(800px, 100%); max-width: 800px; z-index: 100; }
       .input-wrapper { flex: 1; display: flex; align-items: center; background: #020617; border: 1px solid var(--border); border-radius: 16px; padding: 0 6px 0 16px; transition: 0.2s; }
       .input-wrapper:focus-within { border-color: var(--bcorp-blue); box-shadow: 0 0 0 2px rgba(0,191,255,0.2); }
        #userInput { flex: 1; padding: 16px 10px; background: transparent; border: none; color: #e2e8f0; font-size: 16px; outline: none; font-family: 'Inter'; width: 100%; }
       .upload-btn { padding: 10px; background: transparent; border: none; cursor: pointer; font-size: 20px; color: #64748b; transition: 0.2s; }
       .upload-btn:hover { color: var(--bcorp-blue); }
       .send-btn { padding: 14px 24px; background: linear-gradient(135deg, #0077ff 0%, #00BFFF 100%); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 15px; min-width: 80px; transition: all 0.2s; box-shadow: 0 0 15px rgba(0,191,255,0.3); font-family: 'Space Grotesk'; }
       .send-btn:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(0,191,255,0.5); }
       .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) { .sidebar { width: 280px; box-shadow: 0 0 30px rgba(0,0,0,0.5); } .close-sidebar { display: block; } #appContainer { margin-left: 0; } .input-area { left: 0; transform: translateX(0); width: 100%; padding: 12px; } .hamburger { display: block; } .hero-top { padding-top: 60px; } .bcorp-title { font-size: 28px; } .message { max-width: 90%; } .copy-btn { opacity: 1; } }
    </style>
</body>
      </html>
