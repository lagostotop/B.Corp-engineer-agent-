<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>B.CORP Brain 3.0 - Universal Tech AI</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap');
        :root { --bcorp-blue: #00BFFF; --bg: #0A0A0F; }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Space Grotesk', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

       .bcorp-face { text-align: center; padding: 40px 20px 20px; }
       .brain { font-size: 80px; animation: float 3s ease-in-out infinite; }
       .eye-pair { display: flex; gap: 25px; justify-content: center; margin: -25px 0 15px; }
       .eye { width: 14px; height: 14px; background: var(--bcorp-blue); border-radius: 50%;
               box-shadow: 0 0 25px var(--bcorp-blue); animation: blink 4s infinite; }
        h1 { color: var(--bcorp-blue); font-size: 38px; letter-spacing: 2px; margin: 0; }
       .subtitle { color: #666; font-size: 13px; margin-top: 6px; }

        @keyframes float {
         0%,100% { transform: translateY(0); filter: drop-shadow(0 0 15px var(--bcorp-blue)); }
         50% { transform: translateY(-6px); filter: drop-shadow(0 0 30px var(--bcorp-blue)); }
        }
        @keyframes blink {
         0%,94%,100% { transform: scaleY(1); }
         97% { transform: scaleY(0.1); }
        }
        @keyframes pulse {
         0%,100% { transform: scale(1); }
         50% { transform: scale(1.1); }
        }

       .header {
            background: rgba(10,10,15,0.8);
            backdrop-filter: blur(10px);
            padding: 14px;
            border-bottom: 1px solid #1e293b;
            position: sticky;
            top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
       .clear-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }
       .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 24px 16px;
        }
       .message {
            margin-bottom: 18px;
            padding: 16px 20px;
            border-radius: 16px;
            max-width: 90%;
            line-height: 1.7;
            font-size: 15px;
            position: relative;
            word-wrap: break-word;
            letter-spacing: 0.2px;
        }
       .user-msg {
            background: #1e40af;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 6px;
        }
       .ai-msg {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
            border-bottom-left-radius: 6px;
        }
       .ai-msg code {
            background: #0f172a;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
        }
       .ai-msg pre {
            background: #0f172a!important;
            border: 1px solid #334155;
            border-radius: 8px;
            position: relative;
            overflow-x: auto;
            margin: 10px 0;
        }
       .ai-msg pre code {
            color: #d4d4d4!important;
            display: block;
            padding: 12px;
            background: transparent!important;
            font-size: 13px;
        }
       .copy-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: #334155;
            color: #e2e8f0;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
        }
       .copy-btn:hover {background: #475569;}

       .delete-btn {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #ef4444;
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: none;
        }
       .message:hover.delete-btn {
            display: block;
        }

       .typing::after {
            content: '▋';
            animation: blink 1s infinite;
            color: var(--bcorp-blue);
        }

       .input-area {
            background: rgba(10,10,15,0.9);
            backdrop-filter: blur(10px);
            padding: 14px;
            border-top: 1px solid #1e293b;
            display: flex;
            gap: 10px;
            flex-direction: column;
        }
       .input-row {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 14px;
            color: #e2e8f0;
            font-size: 16px;
            outline: none;
        }
        input:focus { border-color: var(--bcorp-blue); box-shadow: 0 0 20px rgba(0,191,255,0.3); }

        /* NEW: Upload button - Step 38 */
       .upload-btn {
            padding: 16px 18px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            font-size: 20px;
            cursor: pointer;
            color: var(--bcorp-blue);
        }
       .upload-btn:hover { background: #334155; }
       .file-preview {
            font-size: 12px;
            color: var(--bcorp-blue);
            padding: 0 5px;
        }

       .mic-btn {
            padding: 16px 18px;
            background: linear-gradient(135deg, var(--bcorp-blue) 0%, #0099cc 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 20px;
            cursor: pointer;
        }
       .mic-btn.recording { background: #dc2626; animation: pulse 1s infinite; }

        button {
            padding: 16px 26px;
            background: linear-gradient(135deg, var(--bcorp-blue) 0%, #0099cc 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        button:active { transform: scale(0.96); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

       .quick-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 12px 16px;
            background: rgba(10,10,15,0.6);
        }
       .quick-btn {
            padding: 10px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            color: var(--bcorp-blue);
            font-size: 13px;
            text-align: center;
            cursor: pointer;
        }
       .quick-btn:active { background: #334155; }
    </style>
</head>
<body>
    <div class="bcorp-face">
        <div class="brain">🧠</div>
        <div class="eye-pair">
            <span class="eye"></span>
            <span class="eye"></span>
        </div>
        <h1>B.CORP</h1>
        <p class="subtitle">Brain 3.0 • Universal Tech AI • Built in Port Harcourt</p>
    </div>

    <div class="header">
        <div>
            <h1>🧠 Brain 3.0</h1>
            <div class="subtitle">Code, Debug, Explain, Build</div>
        </div>
        <button class="clear-btn" onclick="clearChat()">Clear</button>
    </div>

    <div class="quick-grid">
        <div class="quick-btn" onclick="quickMsg('Explain Python list vs tuple')">Python Help</div>
        <div class="quick-btn" onclick="quickMsg('Fix this error: SyntaxError')">Debug Code</div>
        <div class="quick-btn" onclick="quickMsg('How does WiFi work?')">Tech Explain</div>
        <div class="quick-btn" onclick="quickMsg('Build HTML button')">Build With Me</div>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message ai-msg">
            <strong>Brain 3.0 Online</strong><br>
            Ask me anything. Code, hardware, AI, internet, phones.<br>
            Upload 📎 screenshot/PDF or use voice 🎤
        </div>
    </div>

    <div class="input-area">
        <div class="input-row">
            <!-- NEW: Upload button -->
            <label for="fileInput" class="upload-btn">📎</label>
            <input type="file" id="fileInput" accept="image/*,.pdf,.txt,.py,.js,.html,.css" style="display:none">

            <!-- Voice button -->
            <button class="mic-btn" onclick="startVoice()" id="micBtn">🎤</button>

            <input type="text" id="userInput" placeholder="Ask + upload file..."/>
            <button onclick="sendMessage()" id="sendBtn">Send</button>
        </div>
        <div id="filePreview" class="file-preview"></div>
    </div>

    <script>
    let memory = JSON.parse(localStorage.getItem('brain_memory')) || [];
    let isSending = false;
    let selectedFile = null;

    function addMessage(role, text, id = Date.now()) {
        const div = document.createElement('div');
        div.className = 'message ' + (role === 'user'? 'user-msg' : 'ai-msg');
        div.id = 'msg-' + id;
        div.innerHTML = marked.parse(text);
        document.getElementById('chatBox').appendChild(div);
        return div;
    }

    function deleteMsg(id) {
        document.getElementById('msg-' + id).remove();
    }

    function clearChat() {
        if (confirm('Clear all chat?')) {
            document.getElementById('chatBox').innerHTML = '';
            memory = [];
            localStorage.removeItem('brain_memory');
        }
    }

    function addCopyButtons() {
        document.querySelectorAll('.ai-msg pre code').forEach(block => {
            if (block.parentElement.querySelector('.copy-btn')) return;
            let btn = document.createElement('button');
            btn.innerText = 'Copy';
            btn.className = 'copy-btn';
            btn.onclick = () => {
                navigator.clipboard.writeText(block.innerText);
                btn.innerText = 'Copied!';
                setTimeout(() => btn.innerText = 'Copy', 2000);
            };
            block.parentElement.appendChild(btn);
        });
    }

    function playAudio(url) {
        const audio = new Audio(url);
        audio.play().catch(e => console.log('Audio error:', e));
    }

    // File input handler
    document.getElementById('fileInput').addEventListener('change', (e) => {
        selectedFile = e.target.files[0];
        if (selectedFile) {
            document.getElementById('filePreview').innerText = `📎 ${selectedFile.name} - ${(selectedFile.size/1024).toFixed(1)}KB`;
        }
    });

    // Voice input
    function startVoice() {
        if (!('webkitSpeechRecognition' in window)) {
            alert('Voice not supported. Use Chrome browser.');
            return;
        }
        const recognition = new webkitSpeechRecognition();
        recognition.lang = 'en-NG';
        recognition.continuous = false;

        const micBtn = document.getElementById('micBtn');
        micBtn.classList.add('recording');
        micBtn.innerText = '🔴';

        recognition.onresult = (e) => {
            document.getElementById('userInput').value = e.results[0][0].transcript;
        };
        recognition.onend = () => {
            micBtn.classList.remove('recording');
            micBtn.innerText = '🎤';
            sendMessage();
        };
        recognition.start();
    }

    // Typewriter
    async function typeWriter(element, newText) {
        let currentText = element.textContent.trim();
        const newChunk = newText.slice(currentText.length);

        for (let char of newChunk) {
            currentText += char;
            element.innerHTML = marked.parse(currentText);
            document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
            await new Promise(r => setTimeout(r, 15));
        }
    }

    // UPDATED: Send with file support
    async function sendMessage() {
        if (isSending) return;
        isSending = true;

        const input = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const btn = document.getElementById('sendBtn');
        const message = input.value.trim();
        const file = selectedFile;

        if (!message &&!file) {
            isSending = false;
            return;
        }

        const msgId = Date.now();
        let userMsg = message;
        if (file) userMsg += `<br><small class="file-preview">📎 ${file.name}</small>`;
        addMessage('user', userMsg, msgId);

        input.value = '';
        document.getElementById('filePreview').innerText = '';
        selectedFile = null;
        document.getElementById('fileInput').value = '';
        btn.disabled = true;

        const botBox = addMessage('ai', '<span class="typing">Brain 3.0 analyzing</span>', msgId + 1);
        let fullAnswer = '';

        try {
            const formData = new FormData();
            formData.append('question', message);
            formData.append('memory', JSON.stringify(memory));
            if (file) formData.append('file', file);

            const response = await fetch('/ask', {
                method: 'POST',
                body: formData
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            while (true) {
                const {done, value} = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value);
                const lines = chunk.split('\n');

                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const text = line.replace('data: ', '');

                        if (text === '[DONE]') {
                            memory.push({role: 'assistant', content: fullAnswer});
                            if (memory.length > 20) memory = memory.slice(-20);
                            localStorage.setItem('brain_memory', JSON.stringify(memory));
                            botBox.innerHTML = marked.parse(fullAnswer) + `<button class="delete-btn" onclick="deleteMsg(${msgId + 1})">×</button>`;
                            addCopyButtons();
                            break;
                        }
                        else if (text.startsWith('[AUDIO]')) {
                            playAudio(text.replace('[AUDIO]', ''));
                        }
                        else {
                            fullAnswer += text;
                            const cleanText = fullAnswer.replace(/###/g, '### ').replace(/\*\*/g, '** ');
                            await typeWriter(botBox, cleanText);
                        }
                    }
                }
            }
        } catch (e) {
            botBox.innerHTML = 'Upload failed. File must be <10MB.<button class="delete-btn" onclick="deleteMsg(' + (msgId + 1) + ')">×</button>';
        }

        btn.disabled = false;
        isSending = false;
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function quickMsg(text) {
        if (isSending) return;
        document.getElementById('userInput').value = text;
        sendMessage();
    }

    document.getElementById('userInput').addEventListener('keypress', e => {
        if (e.key === 'Enter') sendMessage();
    });
    </script>
</body>
    </html>
