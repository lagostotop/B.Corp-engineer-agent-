<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain 3.0 by B.CORP - Nigeria's AI</title>
    <link rel="manifest" href="/static/manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/marked@14.1.2/lib/marked.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');
        :root { --bcorp-blue: #00BFFF; --bg: #0A0A0F; --card: #111118; --border: #23232F; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Space Grotesk', sans-serif; }
        body { background: var(--bg); color: #F5F5F7; min-height: 100vh; }

        /* LOGIN */
       .auth-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
       .auth-box { width: 90%; max-width: 400px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 30px; text-align: center; }
       .brain-logo { font-size: 70px; filter: drop-shadow(0 0 25px var(--bcorp-blue)); margin-bottom: 10px; animation: float 3s ease-in-out infinite; }
       .auth-box h1 { color: var(--bcorp-blue); font-size: 28px; }
       .auth-box p { color: #A0A0B3; margin-bottom: 20px; }
       .auth-input { width: 100%; padding: 14px; margin-bottom: 12px; background: #0E0E14; border: 1px solid var(--border); border-radius: 12px; color: #fff; }
       .auth-btn { width: 100%; padding: 14px; background: var(--bcorp-blue); color: #000; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; margin-bottom: 10px; }
       .auth-btn.secondary { background: transparent; border: 1px solid var(--border); color: #fff; }
       .auth-error { color: #ef4444; font-size: 12px; margin-top: 10px; }

        /* APP */
        #appContainer { display: none; flex-direction: column; height: 100vh; }
       .header { padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
       .brain-header { display: flex; align-items: center; gap: 10px; }
       .logout { background: var(--bcorp-blue); border: none; color: #000; padding: 8px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; }
       .mode-select { background: #0E0E14; border: 1px solid var(--border); color: #fff; border-radius: 8px; padding: 6px 10px; }
       .chat-box { flex: 1; overflow-y: auto; padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; }
       .message { margin-bottom: 15px; padding: 14px 18px; border-radius: 18px; max-width: 80%; }
       .user-msg { background: #1E40AF; margin-left: auto; }
       .ai-msg { background: var(--card); border: 1px solid var(--border); }
       .input-area { padding: 15px; display: flex; gap: 10px; max-width: 800px; margin: 0 auto; width: 100%; }
       .input-area input { flex: 1; padding: 14px; background: #0E0E14; border: 1px solid var(--border); border-radius: 12px; color: #fff; }
       .upload-btn { padding: 14px; background: transparent; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; }
       .send { padding: 14px 24px; background: var(--bcorp-blue); color: #000; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    </style>
</head>
<body>
    <div id="authScreen" class="auth-container">
        <div class="auth-box">
            <div class="brain-logo">🧠</div>
            <h1>B.CORP</h1>
            <p>Brain 3.0 • Nigeria's AI • 2026</p>
            <input type="email" id="email" class="auth-input" placeholder="Email">
            <input type="password" id="password" class="auth-input" placeholder="Password">
            <button class="auth-btn" onclick="signIn()">Login</button>
            <button class="auth-btn secondary" onclick="signUp()">Create Account</button>
            <div id="authError" class="auth-error"></div>
        </div>
    </div>

    <div id="appContainer">
        <div class="header">
            <div class="brain-header">
                <span>🧠</span>
                <div>
                    <div style="font-weight:600;">Brain 3.0</div>
                    <div style="font-size:12px; color:var(--bcorp-blue);" id="userEmail"></div>
                </div>
            </div>
            <div style="display:flex; gap:8px;">
                <select id="modeSelect" class="mode-select">
                    <option value="pro">Pro</option>
                    <option value="pidgin">Naija</option>
                    <option value="code">Code</option>
                </select>
                <button class="logout" onclick="logout()">Logout</button>
            </div>
        </div>
        <div class="chat-box" id="chatBox"></div>
        <div class="input-area">
            <input type="file" id="fileInput" accept="image/*,.pdf,.txt" style="display:none">
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">📎</button>
            <input type="text" id="userInput" placeholder="Ask Brain 3.0 anything..."/>
            <button class="send" onclick="sendMessage()">Send</button>
        </div>
    </div>

<script>
let supabaseClient, userId, userEmail, selectedFile = null;

fetch('/config').then(r=>r.json()).then(c=>{
    supabaseClient = supabase.createClient(c.supabase_url, c.supabase_key)
    checkAuth();
});

function checkAuth(){
    supabaseClient.auth.getSession().then(({data:{session}})=>{
        if(session){ userId=session.user.id; userEmail=session.user.email; showApp(); }
    })
}

function showApp(){
    document.getElementById('authScreen').style.display='none';
    document.getElementById('appContainer').style.display='flex';
    document.getElementById('userEmail').innerText=userEmail;
    addMessage('ai','### Welcome back CEO\nI\'m **Brain 3.0 by B.CORP**. Ready.');
}

async function signUp(){
    const {error} = await supabaseClient.auth.signUp({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
    })
    if(error) document.getElementById('authError').innerText = error.message;
    else alert('Account created! Now Login.');
}

async function signIn(){
    const {data,error} = await supabaseClient.auth.signInWithPassword({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
    })
    if(error) document.getElementById('authError').innerText = error.message;
    else { userId=data.user.id; userEmail=data.user.email; showApp(); }
}

async function logout(){ await supabaseClient.auth.signOut(); location.reload(); }

function addMessage(role, text){
    const div = document.createElement('div');
    div.className = 'message ' + (role=='user'?'user-msg':'ai-msg');
    div.innerHTML = marked.parse(text);
    document.getElementById('chatBox').appendChild(div);
    document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
}

document.getElementById('fileInput').addEventListener('change', (e)=>{ selectedFile = e.target.files[0]; });

async function sendMessage(){
    const input = document.getElementById('userInput');
    const message = input.value.trim();
    const mode = document.getElementById('modeSelect').value;
    if(!message &&!selectedFile) return;

    if(message) addMessage('user', message);
    input.value='';

    const botBox = addMessage('ai', 'Thinking...');
    let full = '';

    const formData = new FormData();
    formData.append('question', message);
    formData.append('mode', mode);
    formData.append('user_id', userId);
    if(selectedFile) formData.append('file', selectedFile);

    const res = await fetch('/ask', {method:'POST', body: formData});
    const reader = res.body.getReader(); const decoder = new TextDecoder();
    while (true) {
        const {done, value} = await reader.read(); if (done) break;
        let chunk = decoder.decode(value);
        if(chunk.startsWith('data: ')) chunk = chunk.replace('data: ', '');
        if(chunk.includes('[DONE]')) break;
        full += chunk;
        botBox.innerHTML = marked.parse(full);
    }
    selectedFile = null;
    document.getElementById('fileInput').value = '';
}
</script>
</body>
                                               </html>
