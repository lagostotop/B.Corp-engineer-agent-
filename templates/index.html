<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0F">
<title>Brain 3.0 - AI Assistant by B.CORP</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/marked@14.1.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>

<style>
:root{--bcorp-blue:#00BFFF;--bg:#0A0A0F;--card:#131a2a;--glass:rgba(19,26,42,.7);--border:#1e293b;--user:linear-gradient(135deg,#0047ff 0%,#0077ff 100%);--text:#FFFFFF;--muted:#64748b;--sidebar-w:280px}
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;background:var(--bg);scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;color:var(--text);height:100dvh;overflow:hidden;display:flex}

.sidebar{position:fixed;left:0;top:0;width:var(--sidebar-w);height:100dvh;background:var(--glass);backdrop-filter:blur(16px);border-right:1px solid var(--border);padding:16px 10px;overflow-y:auto;z-index:200;transition:transform .3s ease;display:flex;flex-direction:column;transform:translateX(-100%)}
.sidebar.show{transform:translateX(0)}.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:199}
.sidebar-overlay.show{display:block}.close-sidebar{display:none;font-size:24px;color:var(--bcorp-blue);cursor:pointer;padding:6px 10px;position:absolute;right:10px;top:10px;background:0;border:none}
.brand{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;background:linear-gradient(90deg,#00BFFF,#4FC3F7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.new-chat-btn{width:100%;padding:12px;background:linear-gradient(135deg,#0077ff 0%,#00BFFF 100%);color:#fff;border:none;border-radius:12px;font-weight:700;cursor:pointer;margin-bottom:16px;font-family:'Space Grotesk',sans-serif;box-shadow:0 0 20px rgba(0,191,255,.3)}
.new-chat-btn:hover{box-shadow:0 0 30px rgba(0,191,255,.5)}
.chat-item{padding:12px;border-radius:10px;cursor:pointer;margin-bottom:6px;font-size:14px;display:flex;justify-content:space-between;align-items:center;border:1px solid transparent}
.chat-item:hover,.chat-item.active{background:var(--card);border-color:var(--border)}
.chat-delete{opacity:0;cursor:pointer;color:#ef4444;padding:4px 8px;border:none;background:0;border-radius:6px}
.chat-item:hover .chat-delete{opacity:1}
.user-profile{padding:12px;border-top:1px solid var(--border);margin-top:auto;display:flex;flex-direction:column;gap:8px}
.user-email{font-size:12px;color:var(--muted);word-break:break-all}
.logout-btn{padding:10px;background:linear-gradient(135deg,#dc2626 0%,#ef4444 100%);color:white;border:none;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px}

#appContainer{display:flex!important;flex-direction:column;flex:1;margin-left:0;height:100dvh}
@media (min-width:769px){.sidebar{transform:translateX(0)}#appContainer{margin-left:var(--sidebar-w)}.hamburger{display:none!important}.close-sidebar{display:none}}
@media (max-width:768px){.close-sidebar{display:block}}

.hero-top{text-align:center;padding:20px 16px 12px;border-bottom:1px solid var(--border);max-width:900px;margin:0 auto;width:100%}
.brain-logo{width:72px;height:72px;margin:0 auto 12px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#00BFFF 0%,#0047ff 100%);box-shadow:0 0 40px rgba(0,191,255,.6);animation:glow 2s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 30px rgba(0,191,255,.4)}to{box-shadow:0 0 60px rgba(0,191,255,.8)}}
.bcorp-title{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:700;background:linear-gradient(90deg,#00BFFF,#4FC3F7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hamburger{display:none;font-size:24px;cursor:pointer;color:var(--bcorp-blue);position:fixed;top:15px;left:15px;z-index:300;background:var(--card);padding:10px 14px;border-radius:10px;border:1px solid var(--border)}
.chat-box{flex:1;overflow-y:auto;padding:20px 14px 160px;max-width:900px;margin:0 auto;width:100%}
.welcome{padding:40px 20px;text-align:center;color:var(--muted)}
.welcome h3{font-family:'Space Grotesk',sans-serif;font-size:24px;color:var(--text);margin-bottom:8px}

.message-wrap{display:flex;gap:10px;margin-bottom:20px;flex-direction:column}
.message-row{display:flex;gap:12px}
.message-avatar{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;font-size:12px}
.user-avatar{background:var(--user);color:#fff}
.ai-avatar{background:radial-gradient(circle at 30% 30%,#00BFFF 0%,#0047ff 100%);color:#fff}
.message{padding:14px 18px;border-radius:18px;max-width:85%;line-height:1.65;font-size:15px;animation:fadeIn .3s ease;position:relative}
.user-msg{background:var(--user);margin-left:auto;color:#fff;white-space:pre-wrap}
.ai-msg{background:var(--card);border:1px solid var(--border);color:#FFF}
.ai-msg pre{background:#020617;padding:14px;border-radius:10px;overflow-x:auto;margin:12px 0;border:1px solid var(--border);font-size:13px}
.ai-msg code{background:#020617;padding:2px 6px;border-radius:4px;font-size:13px}
.agent-banner{background:linear-gradient(90deg,#0047ff,#00BFFF);padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;margin-bottom:10px;display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.sources{margin-top:16px;padding:12px;border:1px solid var(--border);border-radius:10px;background:#020617}
.source-card{margin:6px 0;font-size:13px}.source-card a{color:var(--bcorp-blue);text-decoration:none}
.copy-row{display:flex;gap:8px;margin-left:48px;margin-top:6px}
.copy-btn{font-size:12px;background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:4px}
.copy-btn:hover{color:var(--text);background:var(--card)}

.file-preview{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;width:100%}
.file-preview span{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-remove{background:transparent;border:none;color:#ef4444;font-size:18px;cursor:pointer}

.input-area{background:rgba(10,10,15,.85);backdrop-filter:blur(16px);padding:14px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-end;position:sticky;bottom:0;max-width:900px;margin:0 auto;width:100%;flex-direction:column}
.input-wrapper{flex:1;display:flex;align-items:center;background:#020617;border:1px solid var(--border);border-radius:16px;padding:0 6px 0 16px;min-width:0;width:100%}
#userInput{flex:1;padding:16px 10px;background:transparent;border:none;color:#e2e8f0;font-size:16px;outline:none;resize:none;max-height:200px;font-family:'Inter',sans-serif}
.upload-btn{padding:10px;background:transparent;border:none;cursor:pointer;font-size:20px;color:#64748b}
.control-btn{padding:10px 14px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:10px;font-weight:600;cursor:pointer;font-size:13px}
.control-btn:hover{background:#334155}
.send-btn{padding:14px 24px;background:linear-gradient(135deg,#0077ff 0%,#00BFFF 100%);color:#fff;border:none;border-radius:12px;font-weight:700;cursor:pointer;font-family:'Space Grotesk',sans-serif;box-shadow:0 0 20px rgba(0,191,255,.3)}
.send-btn:disabled{opacity:.5;cursor:not-allowed}

#authScreen{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center}
.auth-card{max-width:420px;width:90%;padding:40px;background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:20px;text-align:center;box-shadow:0 0 40px rgba(0,191,255,.2)}
.auth-card h2{font-family:'Space Grotesk',sans-serif;font-size:32px;margin-bottom:8px;background:linear-gradient(90deg,#00BFFF,#4FC3F7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.auth-input{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:1px solid var(--border);background:#020617;color:var(--text);font-size:15px}
.auth-btn{width:100%;padding:14px;background:linear-gradient(135deg,#0077ff 0%,#00BFFF 100%);color:#fff;border:none;border-radius:12px;font-weight:700;cursor:pointer;margin-top:8px;font-family:'Space Grotesk',sans-serif}
.auth-btn.secondary{background:var(--card)}
.auth-error{color:#ef4444;margin-top:12px;font-size:13px;min-height:18px}
.auth-status{color:#64748b;margin-top:12px;font-size:13px;min-height:18px}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:#020617}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
</head>
<body>

<div id="authScreen">
  <div class="auth-card">
    <h2>Brain 3.0</h2>
    <p style="color:var(--muted);margin-bottom:24px">Sign in to B.CORP AI</p>
    <input id="emailInput" type="email" placeholder="Email" class="auth-input" autocomplete="email">
    <input id="passwordInput" type="password" placeholder="Password" class="auth-input" autocomplete="current-password">
    <button id="loginBtn" class="auth-btn">Sign In</button>
    <button id="signupBtn" class="auth-btn secondary">Create Account</button>
    <p id="authError" class="auth-error"></p>
    <p id="authStatus" class="auth-status">Loading authentication...</p>
  </div>
</div>

<div id="chatContainer" style="display:none;width:100%;height:100%">
  <div class="sidebar" id="sidebar">
    <button class="close-sidebar" id="closeSidebarBtn">✕</button>
    <div class="brand">🧠 Brain 3.0</div>
    <button class="new-chat-btn" id="newChatBtn">+ New Chat</button>
    <div id="chatList" style="flex:1;overflow-y:auto"></div>
    <div class="user-profile">
      <div class="user-email" id="userEmailDisplay"></div>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
  </div>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  
  <div id="appContainer">
    <button class="hamburger" id="hamburgerBtn">☰</button>
    <div class="hero-top">
      <div class="brain-logo"></div>
      <h1 class="bcorp-title">B.CORP</h1>
      <p style="color:#888;font-size:13px">Brain 3.0 • AI Assistant • 2026</p>
    </div>
    <div class="chat-box" id="chatBox">
      <div class="welcome">
        <h3>Welcome to Brain 3.0</h3>
        <p>Your AI assistant by B.CORP. Upload files, research, or just chat.</p>
      </div>
    </div>
    <form id="chatForm" class="input-area">
      <div id="filePreview" class="file-preview" style="display:none">
        <span id="fileName"></span>
        <button type="button" class="file-remove" id="removeFileBtn">×</button>
      </div>
      <div style="display:flex;gap:10px;width:100%">
        <button type="button" class="control-btn" id="stopBtn" style="display:none">Stop</button>
        <button type="button" class="control-btn" id="regenBtn" style="display:none">Regenerate</button>
        <div class="input-wrapper">
          <input type="file" id="fileInput" style="display:none" accept=".pdf,.txt,.md,.py,.js,.ts,.jsx,.tsx,.html,.css,.csv,.json,.png,.jpg,.jpeg,.docx">
          <button type="button" class="upload-btn" id="uploadBtn" title="Attach file">📎</button>
          <textarea id="userInput" placeholder="Ask Brain 3.0 anything... Shift+Enter for new line" rows="1"></textarea>
        </div>
        <button type="submit" class="send-btn" id="sendBtn">Send</button>
      </div>
    </form>
  </div>
</div>

<script src="/static/auth.js"></script>
<script src="/static/app.js"></script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
     .then(reg => console.log('Brain 3.0 SW Registered:', reg.scope))
     .catch(err => console.log('Brain 3.0 SW Registration Failed:', err));
  });
}
</script>
</body></html>
