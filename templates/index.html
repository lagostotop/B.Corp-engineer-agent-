<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.CORP Engineering Agent v1.2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
       .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
       .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
       .chat-box {
            height: 350px;
            overflow-y: auto;
            border: 2px solid #eee;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            background: #fafafa;
        }
       .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 80%;
        }
       .user-msg {
            background: #667eea;
            color: white;
            margin-left: auto;
            text-align: right;
        }
       .ai-msg {
            background: #e9e9ff;
            color: #333;
        }
       .input-area {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }
        button {
            padding: 15px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #764ba2;
            transform: scale(1.05);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 B.CORP Engineering Agent</h1>
        <p class="subtitle">Brain 3.0 v1.2 - Powered by B.CORP OS</p>

        <div class="chat-box" id="chatBox">
            <div class="message ai-msg">Hello Founder. I am Brain 3.0 v1.2. Report factory problem or ask me anything.</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type: Motor overheating at 2pm..." />
            <button onclick="sendMessage()" id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const btn = document.getElementById('sendBtn');
            const message = input.value.trim();

            if (!message) return;

            // Show user message
            chatBox.innerHTML += `<div class="message user-msg">${message}</div>`;
            input.value = '';
            btn.disabled = true;
            chatBox.innerHTML += `<div class="message ai-msg" id="loading">Brain 3.0 thinking...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Send to backend app.py
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({question: message})
                });
                const data = await response.json();

                // Remove loading, show AI response
                document.getElementById('loading').remove();
                chatBox.innerHTML += `<div class="message ai-msg">${data.answer}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (e) {
                document.getElementById('loading').remove();
                chatBox.innerHTML += `<div class="message ai-msg">Error: Check if app.py is running. ${e}</div>`;
            }
            btn.disabled = false;
        }

        // Enter key sends message
        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
  </html>
