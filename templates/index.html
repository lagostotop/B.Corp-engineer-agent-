<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Brain 3.0 - AI Assistant by B.CORP v3.3.7</title>
    <link rel="manifest" href="/static/manifest.json?v=21">
    <meta name="theme-color" content="#0A0A0F">
    <script src="https://cdn.jsdelivr.net/npm/marked@14.1.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap');
        :root { --bcorp-blue: #00BFFF; --bg: #0A0A0F; --card: #111827; --border: #1e293b; --user: #1e40af; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; }

   .auth-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
   .auth-box { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 35px 30px; box-shadow: 0 0 40px rgba(0,191,255,0.15); }
   .brain { font-size: 60px; text-align:center; filter: drop-shadow(0 0 20px var(--bcorp-blue)); animation: float 3s ease-in-out infinite; margin-bottom: 20px; }
   .auth-box h2 { color: var(--bcorp-blue); text-align: center; margin-bottom: 8px; font-size: 24px; font-family: 'Space Grotesk'; }
   .auth-subtitle { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 25px; }
   .auth-input { width: 100%; padding: 14px; margin-bottom: 14px; background: #020617; border: 1px solid var(--border); border-radius: 12px; color: #e2e8f0; font-size: 15px; outline: none; }
   .auth-btn { width: 100%; padding: 14px; margin-bottom: 10px; background: linear-gradient(135deg, var(--bcorp-blue) 0%, #0099cc 100%); color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s; }
   .auth-btn:hover { transform: scale(1.02); box-shadow: 0 0 15px var(--bcorp-blue); }
   .auth-btn.secondary { background: #1e293b; border: 1px solid var(--border); }
   .auth-error { color: #ef4444; text-align: center; font-size: 13px; margin-top: 10px; }

        #appContainer { display: none; flex-direction: column; height: 100vh; }
   .bcorp-face { text-align: center; padding: 30px 20px 15px; }
   .brain.big { font-size: 70px; }
        h1 { color: var(--bcorp-blue); font-size: 32px; font-family: 'Space Grotesk'; text-align:center; }
   .header { background: rgba(10,10,15,0.85); backdrop-filter: blur(12px); padding: 12px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
   .chat-box { flex: 1; overflow-y: auto; padding: 20px 14px 120px; max-width: 750px; margin: 0 auto; width: 100%; }
   .message { margin-bottom: 12px; padding: 14px 16px; border-radius: 16px; max-width: 95%; line-height: 1.65; font-size: 15px; animation: fadeIn 0.3s ease; }
   .user-msg { background: var(--user); margin-left: auto; border-bottom-right-radius: 4px; white-space: pre-wrap; color: #fff; }
   .ai-msg {
        background: linear-gradient(145deg, #111827 0%, #0f172a 100%);
        border: 1px solid var(--border);
        border-bottom-left-radius: 4px;
        color: #FFFFFF;
        overflow-wrap: break-word;
        box-shadow: 0 0 12px rgba(0,191,255,0.08);
      }
   .ai-msg h3 { font-family: 'Space Grotesk'; color: var(--bcorp-blue); margin: 8px 0 6px; font-weight: 700; font-size: 16px; }
   .ai-msg strong { color: var(--bcorp-blue); }
   .ai-msg ul { margin: 6px 0 6px 18px; }
   .ai-msg li { margin-bottom: 4px; }
   .ai-msg code { background: #020617; padding: 2px 6px; border-radius: 4px; color: var(--bcorp-blue); }
   .typing::after { content: '▋'; animation: blink 1s infinite; color: var(--bcorp-blue); }

        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        @keyframes blink { 50% { opacity: 0; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

   .input-area { background: rgba(10,10,15,0.95); backdrop-filter: blur(12px); padding: 14px; border-top: 1px solid var(--border); display: flex; gap: 12px; align-items: center; position: fixed; bottom: 0; left: 0; right: 0; max-width: 750px; margin: 0 auto; z-index: 100; }
        input { flex: 1; padding: 16px 14px; background: #020617; border: 1px solid var(--border); border-radius: 14px; color: #e2e8f0; font-size: 16px; outline: none; min-height: 52px; }
        input:focus { border-color: var(--bcorp-blue); box-shadow: 0 0 0 2px rgba(0,191,255,0.2); }
   .upload-btn { padding: 14px; background: #020617; border: 1px solid var(--border); border-radius: 14px; cursor: pointer; font-size: 20px; min-width: 52px; min-height: 52px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
   .upload-btn:hover { border-color: var(--bcorp-blue); }

   .send-btn { padding: 16px 28px; background: linear-gradient(135deg, var(--bcorp-blue) 0%, #0099cc 100%); color: white; border: none; border-radius: 14px; font-weight: 700; cursor: pointer; font-size: 16px; min-width: 95px; min-height: 52px; transition: all 0.2s; box-shadow: 0 0 15px rgba(0,191,255,0.3); }
   .send-btn:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(0,191,255,0.6); }
   .send-btn:active { transform: scale(0.95); }
   .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

   .logout-btn { background: transparent; border: 1px solid var(--bcorp-blue); color: var(--bcorp-blue); padding: 8px 14px; border-radius: 8px; font-size: 14px; cursor: pointer; transition: 0.2s; }
   .logout-btn:hover { background: var(--bcorp-blue); color: white; }
    </style>
</head>
<body>
    <div id="authScreen" class="auth-container">
        <div class="auth-box">
            <div class="brain">🧠</div>
            <h2>Welcome to Brain 3.0</h2>
            <p class="auth-subtitle">AI Assistant by B.CORP</p>
            <input type="email" id="email" class="auth-input" placeholder="Enter your email" autocomplete="email">
            <input type="password" id="password" class="auth-input" placeholder="Enter your password" autocomplete="current-password">
            <button class="auth-btn" id="loginBtn" onclick="signIn()">Login</button>
            <button class="auth-btn secondary" id="signupBtn" onclick="signUp()">Create Account</button>
            <div id="authError" class="auth-error"></div>
        </div>
    </div>

    <div id="appContainer">
        <div class="bcorp-face">
            <div class="brain big">🧠</div>
            <h1>B.CORP</h1>
            <p style="color:#888; font-size:12px; text-align:center;">Brain 3.0 • AI Assistant • 2026</p>
        </div>
        <div class="header">
            <div><div style="font-size:12px;">🧠 Brain 3.0</div><div style="font-size:12px; color:var(--bcorp-blue);" id="userEmail"></div></div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
        <div class="chat-box" id="chatBox"></div>
        <div class="input-area">
            <input type="file" id="fileInput" accept=".pdf,.txt,.py,.js,.md" style="display:none">
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">📎</button>
            <input type="text" id="userInput" placeholder="Ask Brain 3.0 anything..."/>
            <button class="send-btn" onclick="sendMessage()" id="sendBtn">Send</button>
        </div>
    </div>
    <script>
    marked.setOptions({ breaks: true, gfm: true });
    let supabaseClient = null; let userId = null; let userEmail = null; let isSending = false; let selectedFile = null;

    fetch('/config?v=21').then(res => res.json()).then(config => {
        supabaseClient = supabase.createClient(config.supabase_url, config.supabase_key)
        checkAuth();
    });

    function checkAuth() { supabaseClient.auth.getSession().then(({ data: { session } }) => { if(session) { userId = session.user.id; userEmail = session.user.email; showApp(); } }); }
    async function signUp() { const email=document.getElementById('email').value; const password=document.getElementById('password').value; const {error}=await supabaseClient.auth.signUp({email,password}); if(error) document.getElementById('authError').innerText=error.message; else alert('Check email to confirm'); }
    async function signIn() { const email=document.getElementById('email').value; const password=document.getElementById('password').value; const {error}=await supabaseClient.auth.signInWithPassword({email,password}); if(error) document.getElementById('authError').innerText=error.message; }
    async function logout() { await supabaseClient.auth.signOut(); location.reload(); }

    function formatAIText(text) {
        text = text.replace(/Brain 3\.0/g, '**Brain 3.0**');
        text = text.replace(/,([a-zA-Z])/g, ', $1');
        text = text.replace(/\.([a-zA-Z])/g, '. $1');
        return text;
    }

    function addMessage(role, text) {
        const div = document.createElement('div');
        div.className = 'message ' + (role === 'user'? 'user-msg' : 'ai-msg');
        if(role === 'ai') text = formatAIText(text);
        div.innerHTML = marked.parse(text);
        document.getElementById('chatBox').appendChild(div);
        document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
        return div;
    }

    function showApp() {
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('appContainer').style.display = 'flex';
        document.getElementById('userEmail').innerText = userEmail;

        addMessage('ai', `**Brain 3.0 is online**
I build, debug, and explain code fast.
**Stack**: Python, JS, HTML, CSS, React | **Lang**: English + Pidgin
What should we build?`);
    }

    document.getElementById('fileInput').addEventListener('change', (e)=>{ selectedFile = e.target.files[0]; });

    async function sendMessage() {
        if(isSending) return;
        const input = document.getElementById('userInput');
        const question = input.value.trim();
        if(!question &&!selectedFile) return;

        isSending = true;
        document.getElementById('sendBtn').disabled = true;
        addMessage('user', question);
        input.value = '';

        const aiMsgDiv = addMessage('ai', '');
        aiMsgDiv.classList.add('typing');

        const formData = new FormData();
        formData.append('question', question);
        formData.append('user_id', userId);
        if(selectedFile) formData.append('file', selectedFile);

        try {
            const res = await fetch('/ask', { method: 'POST', body: formData });
            if(!res.ok) throw new Error('Server Error: ' + res.status);

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let fullText = '';
            while(true) {
                const {value, done} = await reader.read();
                if(done) break;
                const chunk = decoder.decode(value);
                const lines = chunk.split('\n');
                for(const line of lines) {
                    if(line.startsWith('data: ')) {
                        const data = line.substring(6);
                        if(data === '[DONE]') break;
                        fullText += data;
                        aiMsgDiv.innerHTML = marked.parse(formatAIText(fullText));
                        document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
                    }
                }
            }
        } catch(err) {
            aiMsgDiv.innerHTML = marked.parse("**Brain 3.0 Error:** " + err.message);
        }

        aiMsgDiv.classList.remove('typing');
        isSending = false;
        document.getElementById('sendBtn').disabled = false;
        selectedFile = null;
    }

    document.getElementById('userInput').addEventListener('keypress', e => { if (e.key === 'Enter' &&!e.shiftKey) { e.preventDefault(); sendMessage(); } });
    </script>
</body>
  </html>
