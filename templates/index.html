<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>B.CORP Brain 3.0 - Universal Tech AI</title>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #0f172a 0%, #020617 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: rgba(15,23,42,0.8);
            backdrop-filter: blur(10px);
            padding: 18px;
            border-bottom: 1px solid #1e293b;
            position: sticky;
            top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            font-size: 20px;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .subtitle {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }
        .clear-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 24px 16px;
        }
        .message {
            margin-bottom: 18px;
            padding: 16px 20px;
            border-radius: 16px;
            max-width: 90%;
            line-height: 1.6;
            font-size: 15px;
            position: relative;
            word-wrap: break-word;
        }
        .user-msg {
            background: #1e40af;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 6px;
        }
        .ai-msg {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
            border-bottom-left-radius: 6px;
        }
        .ai-msg code {
            background: #0f172a;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
        }
        .ai-msg pre {
            background: #0f172a !important;
            border: 1px solid #334155;
            border-radius: 8px;
            position: relative;
            overflow-x: auto;
            margin: 10px 0;
        }
        .ai-msg pre code {
            color: #d4d4d4 !important;
            display: block;
            padding: 12px;
            background: transparent !important;
            font-size: 13px;
        }
        .copy-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: #334155;
            color: #e2e8f0;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
        }
        .copy-btn:hover {background: #475569;}
        
        /* NEW: Delete button like ChatGPT */
        .delete-btn {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #ef4444;
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: none;
        }
        .message:hover .delete-btn {
            display: block;
        }
        
        .typing::after {
            content: '▋';
            animation: blink 1s infinite;
            color: #38bdf8;
        }
        @keyframes blink {50% {opacity: 0;}}
        
        .input-area {
            background: rgba(15,23,42,0.9);
            backdrop-filter: blur(10px);
            padding: 14px;
            border-top: 1px solid #1e293b;
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 14px;
            color: #e2e8f0;
            font-size: 16px;
            outline: none;
        }
        input:focus { border-color: #38bdf8; }
        button {
            padding: 16px 26px;
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        button:active { transform: scale(0.96); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .quick-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 12px 16px;
            background: rgba(15,23,42,0.6);
        }
        .quick-btn {
            padding: 10px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            color: #7dd3fc;
            font-size: 13px;
            text-align: center;
            cursor: pointer;
        }
        .quick-btn:active { background: #334155; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>🧠 B.CORP Brain 3.0</h1>
            <div class="subtitle">Universal Tech AI - Code, Debug, Explain, Build</div>
        </div>
        <button class="clear-btn" onclick="clearChat()">Clear</button>
    </div>

    <div class="quick-grid">
        <div class="quick-btn" onclick="quickMsg('Explain Python list vs tuple')">Python Help</div>
        <div class="quick-btn" onclick="quickMsg('Fix this error: SyntaxError')">Debug Code</div>
        <div class="quick-btn" onclick="quickMsg('How does WiFi work?')">Tech Explain</div>
        <div class="quick-btn" onclick="quickMsg('Build HTML button')">Build With Me</div>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message ai-msg">
            <strong>Brain 3.0 Online</strong><br>
            Ask me anything about technology. Code, hardware, AI, internet, phones. 
            I explain + I build + I fix. Try a button above.
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask anything tech: 'What is API?'"/>
        <button onclick="sendMessage()" id="sendBtn">Send</button>
    </div>

    <script>
        let memory = JSON.parse(localStorage.getItem('brain_memory')) || [];
        let isSending = false; // FIX: Prevent double clicks

        function addMessage(role, text, id = Date.now()) {
            const div = document.createElement('div');
            div.className = 'message ' + (role === 'user' ? 'user-msg' : 'ai-msg');
            div.id = 'msg-' + id;
            div.innerHTML = marked.parse(text) + `<button class="delete-btn" onclick="deleteMsg(${id})">×</button>`;
            document.getElementById('chatBox').appendChild(div);
            return div;
        }

        function deleteMsg(id) {
            document.getElementById('msg-' + id).remove();
        }

        function clearChat() {
            if (confirm('Clear all chat?')) {
                document.getElementById('chatBox').innerHTML = '';
                memory = [];
                localStorage.removeItem('brain_memory');
            }
        }

        function addCopyButtons() {
            document.querySelectorAll('.ai-msg pre code').forEach(block => {
                if (block.parentElement.querySelector('.copy-btn')) return;
                let btn = document.createElement('button');
                btn.innerText = 'Copy';
                btn.className = 'copy-btn';
                btn.onclick = () => {
                    navigator.clipboard.writeText(block.innerText);
                    btn.innerText = 'Copied!';
                    setTimeout(() => btn.innerText = 'Copy', 2000);
                };
                block.parentElement.appendChild(btn);
            });
        }

        function playAudio(url) {
            const audio = new Audio(url);
            audio.play().catch(e => console.log('Audio error:', e));
        }

        async function sendMessage() {
            if (isSending) return; // FIX: Block multiple sends
            isSending = true;

            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const btn = document.getElementById('sendBtn');
            const message = input.value.trim();
            if (!message) {
                isSending = false;
                return;
            }

            // Add user message ONCE
            const msgId = Date.now();
            addMessage('user', message, msgId);
            memory.push({role: 'user', content: message});
            
            input.value = '';
            btn.disabled = true;

            // Create ONE AI message box for streaming
            const botBox = addMessage('ai', '<span class="typing">Brain 3.0 thinking</span>', msgId + 1);
            let fullAnswer = '';

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({question: message, memory: memory})
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const {done, value} = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const text = line.replace('data: ', '');

                            if (text === '[DONE]') {
                                memory.push({role: 'assistant', content: fullAnswer});
                                if (memory.length > 20) memory = memory.slice(-20);
                                localStorage.setItem('brain_memory', JSON.stringify(memory));
                                addCopyButtons();
                                break;
                            }
                            else if (text.startsWith('[AUDIO]')) {
                                playAudio(text.replace('[AUDIO]', ''));
                            }
                            else {
                                fullAnswer += text;
                                botBox.innerHTML = marked.parse(fullAnswer) + `<button class="delete-btn" onclick="deleteMsg(${msgId + 1})">×</button>`;
                                chatBox.scrollTop = chatBox.scrollHeight;
                            }
                        }
                    }
                }
            } catch (e) {
                botBox.innerHTML = 'Connection error. Check internet.<button class="delete-btn" onclick="deleteMsg(' + (msgId + 1) + ')">×</button>';
            }
            
            btn.disabled = false;
            isSending = false; // FIX: Re-enable after done
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function quickMsg(text) {
            if (isSending) return;
            document.getElementById('userInput').value = text;
            sendMessage();
        }

        document.getElementById('userInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
  </html>
