<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Brain 3.0 - AI Assistant by B.CORP v4.2</title>
    <link rel="manifest" href="/static/manifest.json?v=71">
    <meta name="theme-color" content="#0A0A0F">
    <script src="https://cdn.jsdelivr.net/npm/marked@14.1.2/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap');
        :root { --bcorp-blue: #00BFFF; --bg: #0A0A0F; --card: #131a2a; --border: #1e293b; --user: linear-gradient(135deg, #0047ff 0%, #0077ff 100%); --text: #FFFFFF; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; }
        
        .auth-container { display: none!important; }
        
        /* SIDEBAR */
        .sidebar { 
            position: fixed; 
            left: 0; 
            top: 0; 
            width: 260px; 
            height: 100vh; 
            background: #0A0A0F; 
            border-right: 1px solid var(--border); 
            padding: 16px 10px; 
            overflow-y: auto; 
            z-index: 200; 
            transition: transform 0.3s ease; 
            display: flex; 
            flex-direction: column; 
            transform: translateX(-100%);
        }
        .sidebar.show { transform: translateX(0); }
        
        .sidebar-overlay { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.6); 
            z-index: 199; 
            backdrop-filter: blur(2px);
        }
        .sidebar.show ~ .sidebar-overlay { display: block; }

        .close-sidebar { display: none; font-size: 24px; color: var(--bcorp-blue); cursor: pointer; padding: 6px 10px; position: absolute; right: 10px; top: 10px; }
        .new-chat-btn { width: 100%; padding: 12px; background: var(--bcorp-blue); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; margin-bottom: 20px; font-size: 15px; font-family: 'Space Grotesk'; transition: 0.2s; }
        .new-chat-btn:hover { box-shadow: 0 0 15px var(--bcorp-blue); transform: translateY(-1px); }
        .chat-item { padding: 12px; border-radius: 8px; cursor: pointer; margin-bottom: 5px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; transition: 0.2s; }
        .chat-item span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .chat-item:hover,.chat-item.active { background: #1e293b; }
        .chat-delete { opacity: 0; cursor: pointer; color: #ef4444; padding: 4px 8px; font-size: 18px; flex-shrink: 0; border-radius: 4px; transition: 0.2s; }
        .chat-item:hover .chat-delete { opacity: 1; }
        .chat-delete:hover { background: rgba(239,68,68,0.2); }

        /* MAIN APP - CENTERED LIKE CHATGPT */
        #appContainer { 
            display: flex!important; 
            flex-direction: column; 
            flex: 1; 
            margin-left: 0; /* FIX 1: NO MARGIN BY DEFAULT */
            height: 100vh; 
            position: relative; 
            transition: margin-left 0.3s ease;
        }
        @media (min-width: 769px) {
            .sidebar.show ~ #appContainer { margin-left: 260px; } /* ONLY SHIFT WHEN OPEN */
        }

        .hero-top { text-align: center; padding: 30px 20px 15px; border-bottom: 1px solid var(--border); max-width: 800px; margin: 0 auto; width: 100%; }
        .brain-img.big { width: 110px; height: 110px; animation: float 3s ease-in-out infinite; filter: drop-shadow(0 0 30px var(--bcorp-blue)); margin-bottom: 10px; }
        .bcorp-title { font-family: 'Space Grotesk'; font-size: 38px; font-weight: 700; background: linear-gradient(90deg, #00BFFF, #4FC3F7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0 0 5px; }
        .bcorp-subtitle { color:#888; font-size:13px; text-align:center; letter-spacing: 0.5px; }
        .brain-label { display: flex; align-items: center; gap: 8px; padding: 12px 18px; border-bottom: 1px solid var(--border); font-size: 14px; font-weight: 500; max-width: 800px; margin: 0 auto; width: 100%; }
        .brain-label img { width: 20px; height: 20px; }
        .hamburger { display: none; font-size: 24px; cursor: pointer; color: var(--bcorp-blue); position: absolute; top: 15px; left: 15px; z-index: 300; }
        
        /* CHAT */
        .chat-box { flex: 1; overflow-y: auto; padding: 20px 14px 140px; max-width: 800px; margin: 0 auto; width: 100%; scroll-behavior: smooth; }
        .message-wrap { display: flex; gap: 10px; margin-bottom: 16px; align-items: flex-start; }
        .message-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .message-avatar img { width: 24px; height: 24px; }
        .message { padding: 14px 16px; border-radius: 18px; max-width: 85%; line-height: 1.65; font-size: 15px; animation: fadeIn 0.3s ease; position: relative; }
        .user-msg { background: var(--user); margin-left: auto; border-bottom-right-radius: 4px; color: #fff; }
        .ai-msg { background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; color: #FFFFFF; }
        
        .agent-banner {
            background: linear-gradient(90deg, rgba(0,191,255,0.15), rgba(0,119,255,0.15));
            border: 1px solid var(--bcorp-blue);
            color: var(--bcorp-blue);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
            font-family: 'Space Grotesk';
        }
        
        /* MARKDOWN */
        .ai-msg h3 { color: var(--bcorp-blue); font-family: 'Space Grotesk'; margin: 16px 0 10px; font-size: 17px; }
        .ai-msg p { margin: 8px 0; }
        .ai-msg ul, .ai-msg ol { margin: 8px 0 8px 20px; }
        .ai-msg strong { color: var(--bcorp-blue); font-weight: 600; }
        .ai-msg pre { background: #020617; padding: 14px; border-radius: 10px; overflow-x: auto; margin: 12px 0; border: 1px solid var(--border); }
        .ai-msg code { font-family: 'Consolas', monospace; font-size: 13px; }
        .ai-msg table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 14px; }
        .ai-msg th, .ai-msg td { border: 1px solid var(--border); padding: 10px; text-align: left; }
        .ai-msg th { background: #020617; color: var(--bcorp-blue); font-weight: 600; }
        
        .sources { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
        .sources b { font-family: 'Space Grotesk'; color: var(--bcorp-blue); }
        .source-card { background: #020617; border: 1px solid var(--border); padding: 10px 12px; border-radius: 10px; margin: 8px 0; transition: 0.2s; }
        .source-card:hover { border-color: var(--bcorp-blue); transform: translateX(2px); }
        .source-card a { color: var(--bcorp-blue); text-decoration: none; font-size: 13px; font-weight: 500; }
        .source-card a:hover { text-decoration: underline; }

        .msg-meta { font-size: 11px; color: #64748b; margin-top: 8px; }
        .copy-btn { position: absolute; top: 8px; right: 8px; background: #020617; border: 1px solid var(--border); color: var(--bcorp-blue); padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; opacity: 0; transition: 0.2s; }
        .ai-msg:hover .copy-btn { opacity: 1; }
        .copy-btn:hover { background: var(--bcorp-blue); color: #000; }
        
        .typing-dots::after { 
            content: '●'; 
            animation: dots 1.4s infinite; 
            color: var(--bcorp-blue); 
            letter-spacing: 4px;
            font-size: 16px;
        }
        
        .controls { display: flex; gap: 10px; padding: 0 14px 10px; max-width: 800px; margin: 0 auto; width: 100%; justify-content: center; }
        .control-btn { padding: 10px 16px; background: #020617; border: 1px solid var(--border); border-radius: 10px; color: var(--bcorp-blue); cursor: pointer; font-size: 14px; display: none; font-weight: 500; }
        .control-btn:hover { border-color: var(--bcorp-blue); }

        /* INPUT - CENTERED */
        .input-area { 
            background: rgba(10,10,15,0.95); 
            backdrop-filter: blur(12px); 
            padding: 14px; 
            border-top: 1px solid var(--border); 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            position: fixed; 
            bottom: 0; 
            left: 0; /* FIX 2: ALWAYS CENTER */
            right: 0; 
            max-width: 800px; 
            margin: 0 auto; 
            z-index: 100; 
        }

        /* ANIMATIONS */
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); }
        @keyframes dots { 0% { content: '●○'; } 33% { content: '●○'; } 66% { content: '●●●'; } 100% { content: '●○'; } } /* FIX 3: CLOSED BRACE */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        /* MOBILE */
        @media (max-width: 768px) {
            .sidebar { width: 280px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
            .close-sidebar { display: block; }
            #appContainer { margin-left: 0; }
            .input-area { left: 0; max-width: 100%; padding: 12px; }
            .hamburger { display: block; }
            .hero-top { padding-top: 60px; }
            .bcorp-title { font-size: 28px; }
            .message { max-width: 90%; }
            .copy-btn { opacity: 1; }
        }
        
        .logout-btn { display: none!important; }
    </style>
</head>
<body>
    <div id="authScreen" class="auth-container"></div>
    
    <div class="sidebar" id="sidebar">
        <div class="close-sidebar" id="closeSidebarBtn">✕</div>
        <button class="new-chat-btn" id="newChatBtn">+ New Chat</button>
        <div id="chatList" style="flex:1; overflow-y:auto;"></div>
    </div>
    
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    
    <div id="appContainer">
        <div class="hamburger" id="hamburgerBtn">☰</div>
        
        <div class="hero-top">
            <img src="/static/brain3d.png" class="brain-img big" alt="Brain">
            <h1 class="bcorp-title">B.CORP</h1>
            <p class="bcorp-subtitle">Brain 3.0 • AI Assistant • 2026</p>
        </div>
        
        <div class="brain-label">
            <img src="/static/brain3d.png"> Brain 3.0
        </div>
        
        <div class="chat-box" id="chatBox"></div>
        
        <div class="controls">
            <button class="control-btn" id="stopBtn">⏹ Stop</button>
            <button class="control-btn" id="regenBtn">🔄 Regenerate</button>
        </div>
        
        <div class="input-area">
            <input type="file" id="fileInput" accept=".pdf,.txt,.py,.js,.ts,.jsx,.tsx,.html,.css,.md,.csv,.json,.png,.jpg,.jpeg,.docx" style="display:none">
            <div class="input-wrapper">
                <button class="upload-btn" id="uploadBtn">📎</button>
                <input type="text" id="userInput" placeholder="Ask Brain 3.0 anything..." autocomplete="off"/>
            </div>
            <button class="send-btn" id="sendBtn">Send</button>
        </div>
    </div>
    
    <script src="/static/app.js?v=71"></script>
</body>
      </html>
